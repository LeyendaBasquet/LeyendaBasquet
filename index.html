<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leyenda del Básquet — Simulador de Carrera NBA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f97316'/%3E%3Cpath d='M2 16h28M16 2v28' stroke='%23241300' stroke-width='1.6'/%3E%3Cpath d='M4.2 8 A17 17 0 0 1 4.2 24' stroke='%23241300' fill='none' stroke-width='1.6'/%3E%3Cpath d='M27.8 8 A17 17 0 0 0 27.8 24' stroke='%23241300' fill='none' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%23241300' stroke-width='1.3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000;
  --card:#141414;
  --card2:#1c1c1c;
  --line:#262626;
  --text:#f5f5f5;
  --muted:#8b8b8b;
  --accent:#7c3aed;
  --good:#22c55e;
  --bad:#ef4444;
  --gold:#f2b90c;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;background:rgba(0,0,0,.9);backdrop-filter:blur(6px);
}
#topbar .brand{font-weight:800;font-size:16px;letter-spacing:.5px;}
#topbar .brand span{color:var(--accent);}
.tbtn{display:flex;gap:8px;flex-wrap:wrap;}
button{cursor:pointer;border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;background:#fff;color:#000;transition:transform .18s cubic-bezier(.2,.8,.2,1), filter .18s ease, background .18s ease;}
button:hover{filter:brightness(.92);}
button:active{transform:scale(.97);}
button.outline{background:transparent;color:var(--text);border:1px solid #3a3a3a;}
button.ghost{background:transparent;color:var(--muted);border:1px solid #2a2a2a;padding:6px 12px;font-size:12px;}
button:disabled{opacity:.35;cursor:not-allowed;}
#app{max-width:1400px;margin:0 auto;padding:22px 20px 70px;}
.card{background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--line);}
.small{font-size:12px;color:var(--muted);}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
h1,h2,h3{margin:0;}
h1{font-size:26px;font-weight:800;}
h2{font-size:19px;font-weight:800;}
input[type=text],input[type=number],select{
  width:100%;background:var(--card2);border:1px solid #303030;border-radius:10px;color:var(--text);
  padding:11px 13px;font-size:14px;text-align:center;font-weight:700;text-transform:uppercase;
}
input[type=text]::placeholder,input[type=number]::placeholder{color:#555;text-transform:none;font-weight:400;}

/* ---------- CREATE SCREEN ---------- */
.createGrid{display:grid;grid-template-columns:1fr 1.35fr 1.1fr;gap:0;}
.createCol{padding:26px;border-right:1px solid var(--line);}
.createCol:last-child{border-right:none;}
.createCol h3{font-size:14px;text-align:center;margin-bottom:18px;letter-spacing:.03em;}
.jersey{width:170px;margin:0 auto 20px;position:relative;text-align:center;}
.jersey svg{width:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));}
.jersey .jname{position:absolute;top:38%;left:0;right:0;font-weight:800;font-size:13px;letter-spacing:.06em;color:#111;text-transform:uppercase;}
.jersey .jnum{position:absolute;top:47%;left:0;right:0;font-weight:900;font-size:38px;color:#111;}
.fieldRow{display:flex;gap:10px;margin-bottom:14px;}
.fieldRow>div{flex:1;}
.handToggle{display:flex;background:var(--card2);border-radius:10px;padding:4px;border:1px solid #303030;}
.handToggle div{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .2s ease, color .2s ease;}
.handToggle div.active{background:#fff;color:#000;}
.searchBox{position:relative;margin-bottom:12px;}
.searchBox input{text-align:left;text-transform:none;font-weight:400;padding-left:34px;}
.searchBox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
.natList{max-height:420px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;}
.natRow{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s ease, color .15s ease;}
.natRow:hover{background:var(--card2);}
.natRow.sel{background:var(--accent);color:#fff;}
.natRow .flag{font-size:17px;}
.courtWrap{position:relative;width:100%;max-width:280px;margin:0 auto;}
.courtWrap svg{width:100%;display:block;}
.posBtn{
  position:absolute;transform:translate(-50%,-50%);padding:8px 13px;border-radius:999px;
  background:#1f2a1c;border:1px solid #3a4a35;color:#cfe9c8;font-weight:800;font-size:12.5px;cursor:pointer;
  white-space:nowrap;transition:background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
}
.posBtn:hover{transform:translate(-50%,-50%) scale(1.06);}
.posBtn.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.createFooter{display:flex;justify-content:space-between;padding:18px 26px;border-top:1px solid var(--line);}

/* ---------- HUB SCREEN ---------- */
.hubGrid{display:grid;grid-template-columns:1fr 1.35fr;gap:20px;align-items:start;}
@media(max-width:900px){.hubGrid{grid-template-columns:1fr;} .createGrid{grid-template-columns:1fr;} .createCol{border-right:none;border-bottom:1px solid var(--line);}}
.playerTop{display:flex;gap:14px;align-items:flex-start;}
.ovrBadge{width:66px;height:66px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.ovrBadge .n{font-size:24px;font-weight:900;line-height:1;}
.ovrBadge .l{font-size:9px;font-weight:700;letter-spacing:.05em;opacity:.85;}
.tier-low{background:#5b5f66;color:#e7e9ec;}
.tier-mid{background:#2563eb;color:#eaf0ff;}
.tier-high{background:#ea9d1f;color:#241300;}
.tier-elite{background:linear-gradient(135deg,#f7d774,#e8ab12);color:#241300;}
.idRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.flagPill{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid #303030;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:800;}
.numPill{background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:800;}
.teamLine{display:flex;align-items:center;gap:9px;margin-top:6px;}
.crestSvg{display:block;transition:transform .2s ease;}
.teamName{font-weight:800;font-size:15px;}
.leagueTag{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
.freeAgentTag{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;}
.qmark{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid #303030;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
.metaRight{margin-left:auto;text-align:right;}
.metaRight .num{font-size:20px;font-weight:900;}
.metaRight .lab{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.statsRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
.statCell{text-align:center;}
.statCell .v{font-size:19px;font-weight:900;}
.statCell .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em;}
.trophyRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:20px;}
.trophyRow .empty{color:#555;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;}
.trophyRow .ic{display:inline-flex;}
.champBadge{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;}
.champBadge-nba{background:linear-gradient(90deg,#3a2e00,#544300);color:#FFD24C;border:1px solid #6b5600;}
.champBadge-other{background:var(--card2);color:#cfcfcf;border:1px solid #303030;}
.champBadge-none{background:var(--card2);color:var(--muted);border:1px solid #262626;}
.ringRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%;}
.ringChip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border:1px solid #4a3b00;border-radius:999px;padding:3px 9px 3px 4px;font-size:11px;font-weight:800;color:#FFD24C;}
.injuryBadge{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:700;}
.injuryBadge.sev-leve{background:#332600;color:#f2c94c;border:1px solid #574000;}
.injuryBadge.sev-moderada{background:#3a2200;color:#f2994c;border:1px solid #5c3600;}
.injuryBadge.sev-grave{background:#360d0d;color:#f26b6b;border:1px solid #5c1414;}
.miniInjury{display:inline-flex;margin-left:4px;}
.hrline{height:1px;background:var(--line);margin:18px 0;}
.decisionTitle{font-size:17px;font-weight:800;margin-bottom:5px;}
.decisionDesc{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.offerGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.offerCard{
  background:var(--card2);border:1px solid #2c2c2c;border-radius:14px;padding:14px;cursor:pointer;
  text-align:center;transition:transform .22s cubic-bezier(.2,.8,.2,1), border-color .22s ease, box-shadow .22s ease;
}
.offerCard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.35);}
.offerCard:hover .crestSvg{transform:scale(1.08);}
.offerCard:active{transform:translateY(-1px) scale(.98);}
.offerCard .kicker{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em;margin-bottom:8px;}
.offerCard .crestSvg{margin:0 auto 8px;}
.offerCard .oname{font-weight:800;font-size:13.5px;margin-bottom:3px;}
.offerCard .osub{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;}
.offerCard .odetail{margin-top:8px;font-size:11.5px;color:#cfcfcf;font-weight:700;}
.offerCard.retireCard{border-color:#3a1414;}
.offerCard.retireCard .oname{color:var(--bad);}
.pillChance{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;margin:3px 2px 0;}
.pillChance.up{background:#0f2e1c;color:var(--good);}
.pillChance.down{background:#2e1414;color:var(--bad);}
.gambleImg{height:52px;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#232323;}
.tagPill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-top:8px;}
.tagPill.corazon{background:#2a1a45;color:#c9a0ff;}
.tagPill.plata{background:#0f2e1c;color:var(--good);}
.tagPill.fama{background:#332600;color:#f2c94c;}
.tagPill.ego{background:#3a1400;color:#fb923c;}

/* ---------- VITALS (forma / moral / hinchada / money / fama) ---------- */
.vitalsBar{display:flex;align-items:flex-start;gap:22px;margin-bottom:18px;flex-wrap:wrap;}
.vitalsBars{display:flex;gap:22px;flex:1;flex-wrap:wrap;min-width:220px;}
.vitalItem{min-width:110px;flex:1;}
.vitalTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.vitalTop .vlabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.06em;}
.vitalTop .vval{font-size:13px;font-weight:900;}
.vitalTrack{height:7px;border-radius:4px;background:#242424;overflow:hidden;}
.vitalFill{height:100%;border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.2,1);}
.vitalsMoney{display:flex;gap:14px;align-items:center;flex-shrink:0;padding-top:2px;}
.vitalsMoney .vm{display:flex;align-items:center;gap:5px;font-weight:900;font-size:14px;}
.vitalsMoney .vm.money{color:var(--good);}
.vitalsMoney .vm.fama{color:#FFD24C;}
.shopOpenBtn{background:linear-gradient(180deg,#3a2f0d,#1f1a08);color:#f4d98a;border:1px solid #574000;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;cursor:pointer;}
.shopOpenBtn:hover{filter:brightness(1.15);}
/* Positioned absolute to the modal card itself (not inside the header's flex row) so it can
   never get squeezed off-screen or wrapped away on narrow mobile widths — it's always pinned
   to the same corner regardless of how much the title/money text needs to wrap. */
.shopCloseX{position:absolute;top:12px;right:12px;z-index:5;background:#2a2a2a;color:#fff;border:1px solid #454545;border-radius:50%;width:34px;height:34px;min-width:34px;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.shopCloseX:hover{background:#383838;}
.shopCloseX:active{background:#444;}
.shopCatLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:16px 0 8px;}
.shopCatLabel:first-of-type{margin-top:4px;}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.shopCard{background:var(--card2);border:1px solid #2c2c2c;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.shopCard.owned{border-color:#3a5a3a;background:linear-gradient(160deg,#132013,#1a1a1a);}
.shopIcon{height:34px;display:flex;align-items:center;justify-content:center;}
.shopName{font-weight:800;font-size:13px;}
.shopDesc{font-size:11.5px;color:var(--muted);line-height:1.35;flex:1;}
.shopEffects{display:flex;flex-wrap:wrap;gap:4px;}
.shopPill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800;}
.shopPill.up{background:#0f2e1c;color:var(--good);}
.shopBuyBtn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:7px 10px;font-size:12.5px;font-weight:900;cursor:pointer;margin-top:2px;}
.shopBuyBtn:disabled{opacity:.35;cursor:not-allowed;}
.shopOwned{font-size:11.5px;font-weight:800;color:var(--good);margin-top:2px;}

/* ---------- TIMELINE TABLE ---------- */
.timelineCard{padding:0;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{padding:12px 10px;text-align:left;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;border-bottom:1px solid var(--line);}
tbody td{padding:10px;border-bottom:1px solid #1b1b1b;vertical-align:middle;}
tbody tr.current{background:rgba(124,58,237,.13);}
tbody tr.pending td{color:#555;}
tbody tr.championRow{background:rgba(255,210,76,.07);}
.miniChamp{display:inline-flex;margin-left:4px;}
.rowClub{display:flex;align-items:center;gap:9px;}
.rowAge{font-weight:800;font-size:13px;}
.ovrChip{display:inline-block;min-width:30px;text-align:center;padding:3px 6px;border-radius:6px;font-size:11.5px;font-weight:900;}
.rowTrophies{display:flex;gap:7px;flex-wrap:wrap;}
.rowTrophies span{font-size:13px;}
.natTeamRow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);background:#101010;flex-wrap:wrap;}
.natTeamRow .flag{font-size:20px;}
.natTeamRow .info{font-weight:800;font-size:13px;}
.natTeamRow .stats{display:flex;gap:16px;margin-left:auto;}
.natTeamRow .stats div{text-align:center;}
.natTeamRow .stats .v{font-weight:800;font-size:13px;}
.natTeamRow .stats .l{font-size:9.5px;color:var(--muted);}

/* ---------- RETIRED SCREEN ---------- */
.retiredTop{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:800px){.retiredTop{grid-template-columns:1fr;}}
.teamCardsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.teamHistCard{position:relative;overflow:visible;border-radius:16px;padding:16px;border:1px solid var(--line);}
/* The watermark crest is deliberately oversized and hangs partly off the card, so IT needs its
   own clipped layer -- but the card itself must stay overflow:visible so trophy tooltips (which
   pop up above the icon row) aren't cut off by the card edge. */
.teamHistCardClip{position:absolute;inset:0;border-radius:16px;overflow:hidden;z-index:0;pointer-events:none;}
.teamHistCard .crestSvg{margin-bottom:8px;position:relative;z-index:1;}
.teamHistCard .crestWrap{position:relative;z-index:1;}
.teamHistCard .tname{font-weight:800;font-size:14px;margin-bottom:10px;position:relative;z-index:1;}
.teamHistCard .stats3{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.teamHistCard .stats3 div{text-align:center;}
.teamHistCard .stats3 .v{font-weight:800;font-size:14px;}
.teamHistCard .stats3 .l{font-size:9px;color:var(--muted);}
.teamHistCard .rowTrophies{position:relative;z-index:1;}
.teamWatermark{position:absolute;top:-10px;right:-18px;width:130px;height:130px;opacity:.14;pointer-events:none;object-fit:contain;filter:grayscale(0.15);z-index:0;}
.awardChip{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05);}
.awardChip .ic{font-size:18px;flex-shrink:0;}
.awardSeasons{margin-top:1px;font-size:11px;opacity:.75;}
.fibaHistory{margin-top:10px;}
.fibaHistRow{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:.85;}
.fibaHistRow:last-child{border-bottom:none;}
.lbList{max-height:56vh;overflow-y:auto;margin-top:4px;}
.lbRow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);}
.lbRank{flex-shrink:0;width:26px;text-align:center;font-weight:900;font-size:15px;color:var(--gold);}
.lbMain{flex:1;min-width:0;}
.lbName{font-weight:800;font-size:14px;}
.lbStats{display:flex;gap:12px;flex-shrink:0;}
.lbStats div{text-align:center;}
.lbStats b{display:block;font-size:14px;}
.lbStats .l{display:block;font-size:9px;opacity:.6;letter-spacing:.04em;}
::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
.center{text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.overlaycard{position:relative;background:var(--card);border-radius:18px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--line);}

/* ---------- LOADING / SIMULATING ---------- */
.simCard{padding:50px 24px;animation:fadeIn .25s ease;}
.spinner{font-size:44px;display:inline-block;animation:bounceSpin 1.1s ease-in-out infinite;}
@keyframes bounceSpin{
  0%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-14px) rotate(180deg);}
  100%{transform:translateY(0) rotate(360deg);}
}
.diceSpin{display:inline-block;animation:diceFlip .55s cubic-bezier(.3,.9,.3,1) infinite;}
@keyframes diceFlip{
  0%{transform:rotate(0deg) scale(1);}
  50%{transform:rotate(180deg) scale(1.18);}
  100%{transform:rotate(360deg) scale(1);}
}
.simBar{width:220px;height:6px;border-radius:4px;background:#242424;margin:18px auto 0;overflow:hidden;}
.simBarFill{height:100%;width:40%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:4px;animation:simSlide 1.1s ease-in-out infinite;}
@keyframes simSlide{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(350%);}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}
.flashCard{border-color:var(--good);margin-bottom:14px;animation:fadeIn .3s ease;}
.champReveal{display:flex;align-items:center;gap:16px;margin-bottom:14px;background:linear-gradient(120deg,#3a2e00,#1a1400 70%);border:1px solid #6b5600;animation:fadeIn .35s ease;}
.champRevealTrophy{flex-shrink:0;animation:trophyPulse 1.4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,210,76,.55));}
@keyframes trophyPulse{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.12) rotate(2deg);}}
.champRevealText{font-size:15px;line-height:1.4;color:#FFD24C;}
.trophyRow .ic{cursor:pointer;position:relative;}
.trophyRow .ic:hover::after{
  content:attr(data-tip);position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
  background:#0a0a0a;color:#fff;padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:700;
  white-space:nowrap;z-index:40;box-shadow:0 6px 16px rgba(0,0,0,.5);border:1px solid #333;pointer-events:none;
}
.trophyRow .ic:hover::before{
  content:'';position:absolute;bottom:120%;left:50%;transform:translateX(-50%);

/* ============================= UTILS ============================= */
function rand(min,max){return Math.random()*(max-min)+min;}
function randi(min,max){return Math.floor(rand(min,max+1));}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function choice(arr){return arr[randi(0,arr.length-1)];}
function pickN(arr,n){ const a=shuffle(arr); return a.slice(0,Math.min(n,a.length)); }
function shuffle(arr){let a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=randi(0,i);[a[i],a[j]]=[a[j],a[i]];} return a;}
function gauss(mean,sd){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function fmt1(n){return (Math.round(n*10)/10).toFixed(1);}
function avgStat(total, games){ return games>0 ? fmt1(total/games) : '0.0'; }
function fmtInt(n){return Math.round(n).toLocaleString('es-AR');}
// Real sports-style season label ("2026/2027") instead of a bare calendar year — used for every
// award's "season won" text so it reads like a real season, not just a single year number.
function seasonLabel(y){ return `${y}/${y+1}`; }
function fmtPct(n){return Math.round(n*1000)/10 + '%';}
function fmtMoney(m){
  if(m>=1) return '$' + (Math.round(m*10)/10).toFixed(1) + 'M';
  return '$' + Math.round(m*1000) + 'K';
}
function esc(s){return (s==null?'':String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

/* ============================= SOUND FX (synthesized, no external audio) =============================
   No copyrighted NBA commentary or licensed music is hotlinked here — everything below is generated
   on the fly with the Web Audio API (oscillators + filtered noise), so it's copyright-safe and works
   fully offline. Covers: UI clicks, success/fail stings for risky decisions, and a crowd-roar swell
   for championship moments. */
var SOUND_ON = true;
var _actx = null;
function _ac(){
  if(typeof window==='undefined' || typeof window.AudioContext==='undefined' && typeof window.webkitAudioContext==='undefined') return null;
  if(!_actx){ try{ _actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(_actx.state==='suspended'){ try{ _actx.resume(); }catch(e){} }
  return _actx;
}
function toggleSound(){
  SOUND_ON = !SOUND_ON;
  const btn = document.getElementById('soundBtnTop');
  if(btn) btn.textContent = SOUND_ON ? '🔊 Sonido' : '🔇 Sonido';
  if(SOUND_ON) sfxClick();
}
function _tone(freq, dur, type, gainPeak, delay){
  const ctx = _ac(); if(!ctx || !SOUND_ON) return;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gainPeak||0.18, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxClick(){ _tone(880, 0.07, 'square', 0.06); }
function sfxSuccess(){ _tone(523, 0.11, 'sine', 0.14); _tone(784, 0.16, 'sine', 0.12, 0.09); _tone(1046, 0.2, 'sine', 0.1, 0.18); }
function sfxFail(){ _tone(220, 0.16, 'sawtooth', 0.1); _tone(155, 0.22, 'sawtooth', 0.09, 0.1); }
function sfxWhistle(){ _tone(1800, 0.28, 'sine', 0.07); }
function sfxCrowd(){
  const ctx = _ac(); if(!ctx || !SOUND_ON) return;
  const dur = 2.2;
  const bufferSize = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * 0.6;
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const filt = ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=900; filt.Q.value=0.6;
  const g = ctx.createGain();
  const t0 = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0+0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(filt); filt.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0+dur);
  _tone(660,0.5,'sine',0.08,0.05); _tone(880,0.5,'sine',0.06,0.25);
}

/* ============================= CORE SIM ============================= */
function overallRating(attrs){
  return attrs.tiro*0.16+attrs.finalizacion*0.16+attrs.tiroLibre*0.06+attrs.rebote*0.14+
         attrs.pase*0.14+attrs.defensa*0.16+attrs.atletismo*0.12+attrs.iq*0.06;
}
function posBonus(position){
  const rb = {PG:0,SG:0.5,SF:1.2,PF:3.2,C:4.5}[position];
  const ab = {PG:5.5,SG:1.8,SF:1.1,PF:0.4,C:0.2}[position];
  const bb = {PG:0.3,SG:0.35,SF:0.6,PF:1.1,C:1.5}[position];
  const sb = {PG:1.15,SG:1.05,SF:1.0,PF:0.85,C:0.7}[position];
  return {rb,ab,bb,sb};
}
function simulateSeasonStats(player, opts){
  const a = player.attrs;
  const pb = posBonus(player.position);
  const teammateQ = opts.teamStrength;
  const ov = overallRating(a);
  const expBonus = Math.min(opts.experience||0,6)*0.42;
  let minutes = 11 + ov*0.315 + (ov-teammateQ)*0.15 + expBonus;
  minutes = clamp(minutes, 7, 38);
  // Veteran decline: your attributes already erode with age via passiveGrowth (which is what
  // quietly drags ppg/rpg/apg down as you get older), but on top of that a coach starts
  // trusting older legs with fewer minutes — not every single season, but more and more often
  // as the years pile up, even if you're still skilled on paper.
  const age = opts.age||27;
  if(age>=33){
    const yearsOver = age-32;
    const cutChance = clamp(yearsOver*0.15, 0, 0.85);
    if(Math.random() < cutChance){
      minutes *= clamp(1 - yearsOver*0.05, 0.55, 0.97);
    }
  }
  const mf = minutes/36 * opts.leagueFactor;
  const ppg = mf * ((a.tiro*0.5+a.finalizacion*0.5)/99*31.5) * clamp(gauss(1,0.08),0.78,1.25);
  const rpg = mf * (a.rebote/99*13.5 + pb.rb) * clamp(gauss(1,0.08),0.78,1.25);
  const apg = mf * (a.pase/99*11.3 + pb.ab) * clamp(gauss(1,0.08),0.78,1.25);
  const spg = mf * (a.defensa/99*2.35) * pb.sb * clamp(gauss(1,0.1),0.7,1.3);
  const bpg = mf * ((a.defensa*0.4+a.atletismo*0.3)/99*2.65) * pb.bb * clamp(gauss(1,0.12),0.6,1.4);
  const expTouch = Math.min(opts.experience||0,8)*0.006;
  const fgp = clamp(0.41 + (a.tiro+a.finalizacion)/2/99*0.145 + rand(-0.02,0.02), 0.37,0.64);
  const tpp = clamp(0.28 + a.tiro/99*0.175 + rand(-0.025,0.025), 0.19,0.47);
  const ftp = clamp(0.60 + a.tiroLibre/99*0.33 + expTouch + rand(-0.02,0.02), 0.47,0.95);
  return {ov, minutes, ppg:Math.max(1,ppg), rpg:Math.max(0.5,rpg), apg:Math.max(0.3,apg),
    spg:Math.max(0.15,spg), bpg:Math.max(0.02,bpg), fgp, tpp, ftp};
}
function simulateTeamResult(ov, teamStrength, games, rounds){
  const blend = teamStrength*0.68 + ov*0.32;
  const winPct = clamp(0.5 + (blend-75)/120 + gauss(0,0.05), 0.14,0.86);
  const wins = Math.round(winPct*games);
  const losses = games-wins;
  let advance = 0;
  const madePlayoffs = winPct >= 0.46 + rand(-0.04,0.04);
  if(madePlayoffs){
    for(let r=0;r<rounds;r++){
      const surv = clamp(0.5 + (blend-78)/100, 0.15,0.85);
      if(Math.random() < surv) advance++; else break;
    }
  }
  const bestOnTeam = ov > teamStrength + rand(-3,9);
  return {wins, losses, madePlayoffs, advance, champion: madePlayoffs && advance===rounds, bestOnTeam, blend};
}
function awardZ(score, mean, sd){ return (score-mean)/sd + gauss(0,0.4); }

function computeSeasonAwards(ctx){
  const {league, seasonScore, stats, teamRes, isRookie, lastSeasonScore, attrs} = ctx;
  const awards = [];
  // Award means shifted up (+8ish) to match the higher OVR curve (growth was buffed so
  // careers peak meaningfully higher now) while keeping MVP/All-Star/etc. roughly as rare
  // as before — otherwise everyone would be winning MVP every other year.
  if(league==='NCAA'){
    const z = awardZ(seasonScore, 46, 4);
    if(z>=2.5) awards.push('Jugador del Año Universitario');
    if(z>=1.3) awards.push('All-American');
    if(teamRes.champion){ awards.push('Campeón Nacional Universitario (NCAA)'); if(teamRes.bestOnTeam) awards.push('MVP del Final Four (NCAA)'); }
  } else if(league==='NBA'){
    const z = awardZ(seasonScore, 53, 5);
    const defScore = attrs.defensa*0.55+attrs.atletismo*0.2+attrs.iq*0.15+stats.spg*3+stats.bpg*3;
    const zDef = awardZ(defScore, 69, 8);
    if(z + (ctx.mvpBoost||0) >=2.6) awards.push('MVP de la NBA');
    if(z>=1.9) awards.push('Primer Quinteto de la NBA');
    else if(z>=1.4) awards.push('Segundo Quinteto de la NBA');
    else if(z>=1.0) awards.push('Tercer Quinteto de la NBA');
    if(zDef>=2.5) awards.push('DPOY (Mejor Defensor)');
    if(zDef>=1.7) awards.push('Primer Quinteto Defensivo');
    else if(zDef>=1.1) awards.push('Segundo Quinteto Defensivo');
    const zPts = awardZ(stats.ppg, 16, 5.5);
    if(zPts>=2.35) awards.push('Máximo Anotador de la NBA');
    if(z>=0.7){
      awards.push('All-Star');
      // All-Star weekend side events: fun, low-stakes, rare, and tied to a real skill
      // (shooters get a shot at the Three-Point Contest, athletic finishers at the Dunk Contest).
      if(Math.random() < clamp((attrs.tiro-58)/280, 0.015, 0.12)) awards.push('Campeón del Concurso de Triples');
      if(Math.random() < clamp((attrs.atletismo+attrs.finalizacion-118)/380, 0.015, 0.12)) awards.push('Campeón del Concurso de Volcadas');
    }
    if(stats.minutes<24 && z>=1.2) awards.push('Mejor Sexto Hombre');
    // Real-world logic: a player is only "the Most Improved" relative to their own past self a
    // couple of times in a career (usually early, before that ceiling is already known) — capped
    // at 2 wins total instead of firing every time the season-over-season jump clears the bar.
    if(lastSeasonScore!=null && (ctx.mipWinsSoFar||0) < 2){
      const improvement = seasonScore - lastSeasonScore;
      if(improvement>3.5 && awardZ(improvement,0.5,2.5)>=1.6) awards.push('Jugador Más Mejorado');
    }
    if(isRookie){
      const zr = awardZ(seasonScore, 47, 5);
      if(zr>=2.0) awards.push('Rookie del Año');
      if(zr>=1.2) awards.push('Primer Quinteto de Rookies');
      else if(zr>=0.6) awards.push('Segundo Quinteto de Rookies');
    }
    if(teamRes.champion){ awards.push('Campeón de la NBA'); if(teamRes.bestOnTeam) awards.push('MVP de las Finales'); }
  } else if(league==='EuroLiga'){
    const z = awardZ(seasonScore, 51, 4);
    if(z>=2.3) awards.push('MVP de la Euroliga');
    if(teamRes.champion){ awards.push('Campeón de la Euroliga'); if(teamRes.bestOnTeam) awards.push('MVP de la Final Four'); }
  } else if(league==='CBA'){
    const z = awardZ(seasonScore, 50, 4.5);
    if(z>=2.3) awards.push('MVP de la CBA');
    if(teamRes.champion) awards.push('Campeón de la CBA');
  } else {
    if(teamRes.champion) awards.push('Campeón');
  }
  return awards;
}
function leagueGames(league){ return {NBA:82, EuroLiga:34, CBA:46, Otra:30, NCAA:30}[league]; }
function leagueFactor(league){ return {NBA:1.0, EuroLiga:0.80, CBA:1.12, Otra:0.72, NCAA:0.86}[league]; }
function leagueRounds(league){ return {NBA:4, EuroLiga:3, CBA:3, Otra:2, NCAA:6}[league]; }
// Games per playoff round the player's team actually plays (NBA best-of-7 style series,
// shorter formats for other leagues, single-elimination for the NCAA tournament).
function leagueGamesPerRound(league){ return {NBA:6.2, EuroLiga:4.3, CBA:3.5, Otra:1, NCAA:1}[league]; }

/* ============================= INJURIES ============================= */
const INJURY_SEVERITY = {
  leve:{label:'Leve', statFactor:0.94, gpFactor:0.93, healChance:0.75},
  moderada:{label:'Moderada', statFactor:0.84, gpFactor:0.80, healChance:0.55},
  grave:{label:'Grave', statFactor:0.68, gpFactor:0.6, healChance:0.35}
};
const INJURY_NAMES = {
  leve:['Tobillo','Muñeca','Dedo de la mano','Espalda baja'],
  moderada:['Rodilla','Hombro','Isquiotibial','Pantorrilla'],
  grave:['Tendón de Aquiles','Ligamento cruzado','Fractura de pie','Fractura de mano']
};
function randomInjurySeverity(){
  const r = Math.random();
  if(r<0.62) return 'leve';
  if(r<0.90) return 'moderada';
  return 'grave';
}
function triggerInjury(player, severityKey){
  const sev = severityKey || randomInjurySeverity();
  const name = choice(INJURY_NAMES[sev]);
  player.injury = {name, sev, label: INJURY_SEVERITY[sev].label};
  player.injuryFlag = true;
  if(sev==='grave' && Math.random()<0.35){
    const keys = ['tiro','finalizacion','tiroLibre','rebote','pase','defensa','atletismo','iq'];
    const k = choice(keys);
    player.attrs[k] = clamp(player.attrs[k]-randi(2,5),15,99);
  }
  return player.injury;
}
function tryHealInjury(player){
  if(!player.injury) return false;
  if(Math.random() < INJURY_SEVERITY[player.injury.sev].healChance){
    player.injury = null; player.injuryFlag = false;
    return true;
  }
  return false;
}

function passiveGrowth(player){
  const age = player.age;
  // Growth phases nudged up a small ~8% (career OVRs land a touch higher overall) — the
  // decline phases (30+) are untouched on purpose, so careers still age down for real.
  let pool;
  if(age<=21) pool = rand(8.6,13.4);
  else if(age<=25) pool = rand(6,9.7);
  else if(age<=29) pool = rand(2.8,5.5);
  else if(age<=32) pool = rand(-0.3,1.7);
  else if(age<=36) pool = rand(-3,-1);
  else pool = rand(-5,-2);
  const keys = ['tiro','finalizacion','tiroLibre','rebote','pase','defensa','atletismo','iq'];
  for(const k of keys){
    const delta = pool*0.23 + rand(-1.1,1.1);
    player.attrs[k] = clamp(Math.round(player.attrs[k]+delta),15,99);
  }
}
function applyGambleDelta(player, totalDelta){
  const keys = ['tiro','finalizacion','tiroLibre','rebote','pase','defensa','atletismo','iq'];
  for(const k of keys){
    player.attrs[k] = clamp(Math.round(player.attrs[k] + totalDelta*0.13 + rand(-0.6,0.6)),15,99);
  }
}

function marketValue(ov, age){
  let ageFactor;
  if(age<=19) ageFactor = 0.06 + (age-18)*0.05;
  else if(age<=23) ageFactor = 0.11 + (age-19)*0.11;
  else if(age<=27) ageFactor = 0.55 + (age-23)*0.11;
  else if(age<=30) ageFactor = 1.0 - (age-27)*0.09;
  else if(age<=34) ageFactor = 0.73 - (age-30)*0.13;
  else ageFactor = Math.max(0.015, 0.21 - (age-34)*0.045);
  const skill = Math.pow(Math.max(ov-40,1)/48, 2.6) * 85;
  return Math.max(0.03, skill*Math.max(ageFactor,0.02));
}

/* ============================= STINT SIMULATION ============================= */
// Game mode: 'rapido' (original) simulates 2 real years per decision cycle;
// 'extensivo' simulates 1 real year per cycle, so you get a decision every single year.
function yearsPerCycle(player){ return (player && player.mode==='extensivo') ? 1 : 2; }
function simulateStint(player){
  // NOTE: a "stint" decision cycle spans `yearsPerCycle(player)` real years, but each year
  // is simulated and recorded as its OWN separate season (own row, own game count capped at
  // a single real season's worth of games) so nobody ever sees a "155-game season" — that
  // used to happen because two years' games were summed into a single displayed row.
  const team = player.currentTeamObj;
  const league = team.league;
  const games = leagueGames(league);
  const lf = leagueFactor(league);
  const rounds = leagueRounds(league);
  const seasonsCreated = [];
  const nYears = yearsPerCycle(player);
  for(let yr=0; yr<nYears; yr++){
    // A doping suspension (handed down right before this stint) wipes out most of
    // the first season back: very few games, and no individual awards that year.
    const suspendedThisYear = yr===0 && player._dopingSuspended;
    const exp = player.experienceCounter||0;
    const isRookie = league==='NBA' && exp===0 && player._firstProLeagueIsNBA;
    const injuryPenalty = player.injury ? INJURY_SEVERITY[player.injury.sev].statFactor : 1;
    // Forma is zero-centered at 60 (its starting value) so a fresh player's calibration is
    // unchanged; decisions that raise/lower forma create a real, bounded ±~12% swing in output.
    const formaFactor = 1 + ((player.forma==null?60:player.forma)-60)/100*0.25;
    const stats = simulateSeasonStats(player, {leagueFactor: lf*injuryPenalty*formaFactor, teamStrength: team.strength, experience: exp, age: player.age});
    const teamRes = simulateTeamResult(overallRating(player.attrs), team.strength, games, rounds);
    const seasonScore = overallRating(player.attrs)*0.62 + (teamRes.wins/games)*22 + rand(-3,3);
    const awards = suspendedThisYear ? [] : computeSeasonAwards({
      league, seasonScore, stats, teamRes, isRookie,
      lastSeasonScore: player.lastSeasonScore, attrs: player.attrs,
      mvpBoost: (player.shop && player.shop.mvpCharge) || 0,
      mipWinsSoFar: player.allAwards.filter(a=>a.award==='Jugador Más Mejorado').length
    });
    // A media/press campaign bought in the shop is a one-shot push — it's spent after
    // helping (or not helping) with this stint's MVP case, win or lose.
    if(player.shop && player.shop.mvpCharge) player.shop.mvpCharge = 0;
    // The Copa NBA (Emirates NBA Cup): a separate in-season knockout tournament that only
    // NBA teams/seasons play, on top of (not instead of) the regular title race.
    if(league==='NBA' && !suspendedThisYear && Math.random()<0.55){
      const cupRes = simulateTeamResult(overallRating(player.attrs), team.strength, 6, 3);
      if(cupRes.champion){
        awards.push('Campeón de la Copa NBA');
        if(cupRes.bestOnTeam) awards.push('MVP de la Copa NBA');
      }
    }
    for(const aw of awards){
      player.allAwards.push({label:`${seasonLabel(G.calYear+yr)} · ${team.name}`, award:aw});
    }
    const champion = !!(teamRes.champion && !suspendedThisYear);
    // Money: paid your contracted salary this season. Fama: grows with individual hardware
    // and championships. Forma: drifts back toward a personal baseline each season.
    if(!suspendedThisYear){
      player.money = Math.round(((player.money||0) + (player.currentSalary||0.5))*100)/100;
      player.fama = Math.max(0, Math.round((player.fama||0) + awards.length*3 + (champion?15:0)));
      if(champion) player.hinchada = clamp(Math.round((player.hinchada==null?55:player.hinchada)+10),5,99);
    }
    player.forma = clamp(Math.round((player.forma==null?60:player.forma)*0.82 + 60*0.18 + rand(-5,5)),10,95);
    // Regular season games, PLUS extra games for however far the team went in the playoffs
    // (best-of-7-style series in the NBA => ~5-6 games per round on average; shorter series
    // in other leagues; single-elimination rounds in the NCAA tournament). Capped at one
    // real season's worth — never combined with any other year.
    const injuryGpFactor = player.injury ? INJURY_SEVERITY[player.injury.sev].gpFactor : 1;
    const suspensionGpFactor = suspendedThisYear ? 0.18 : 1;
    const regGp = Math.round(games*clamp(gauss(0.86,0.08),0.55,0.99)*injuryGpFactor*suspensionGpFactor);
    const roundsPlayed = (!suspendedThisYear && teamRes.madePlayoffs) ? Math.min(teamRes.advance+1, rounds) : 0;
    const playoffGp = roundsPlayed>0 ? Math.round(roundsPlayed*leagueGamesPerRound(league)*clamp(gauss(0.9,0.1),0.6,1)*injuryGpFactor) : 0;
    const gp = regGp + playoffGp;
    if(suspendedThisYear) player._dopingSuspended = false;
    const seasonAgeStart = player.age;
    player.lastSeasonScore = seasonScore;
    player.experienceCounter = (player.experienceCounter||0)+1;
    if(league==='NBA' && !player._everPlayedNBA) player._everPlayedNBA = true;
    // Injury resolution: try to recover from an existing injury, then roll for a new one.
    let injuryThisSeason = null;
    if(player.injury) tryHealInjury(player);
    // A "salud" upgrade bought in the shop (kinesiólogo/equipo médico) directly cuts this
    // base per-season injury chance, not just cosmetically — real medical staff, real risk drop.
    const injuryChance = 0.07 * (1 - shopInjuryReduction(player));
    if(!player.injury && Math.random() < injuryChance){ injuryThisSeason = triggerInjury(player); }
    player.age += 1;
    passiveGrowth(player); // every real season now, not just once per 2-year stint
    // Elite feedback loop: a normal player's OVR is capped by the age curve alone and plateaus
    // in the high 70s/low 80s at best -- realistic for a solid pro, but real MVP-caliber seasons
    // should keep pushing a genuine superstar's rating up further (better coaching, resources,
    // and reps that come with being the best player on the floor), not just plateau at the same
    // ceiling as everyone else. A bad or average player never earns these awards, so this only
    // raises the ceiling for actual elite performers, exactly the "if I keep winning MVP I should
    // have a higher OVR" gap -- it doesn't touch the floor for anyone else.
    if(!suspendedThisYear){
      let eliteBonus = 0;
      if(awards.includes('MVP de la NBA')) eliteBonus += 3;
      else if(awards.includes('Primer Quinteto de la NBA')) eliteBonus += 1.5;
      else if(awards.includes('Segundo Quinteto de la NBA')) eliteBonus += 0.8;
      if(awards.includes('DPOY (Mejor Defensor)')) eliteBonus += 1;
      if(awards.includes('Máximo Anotador de la NBA')) eliteBonus += 0.6;
      if(eliteBonus>0){
        for(const k of ['tiro','finalizacion','tiroLibre','rebote','pase','defensa','atletismo','iq']){
          player.attrs[k] = clamp(Math.round(player.attrs[k] + eliteBonus + rand(-0.3,0.3)), 15, 99);
        }
      }
    }
    const season = {
      ageStart: seasonAgeStart, team, league,
      ovrEnd: Math.round(overallRating(player.attrs)),
      pj: gp, pts: Math.round(stats.ppg*gp), reb: Math.round(stats.rpg*gp), ast: Math.round(stats.apg*gp),
      stl: Math.round(stats.spg*gp), blk: Math.round(stats.bpg*gp),
      fgp: stats.fgp, tpp: stats.tpp, ftp: stats.ftp,
      trophies: awards.slice(), champion, injury: injuryThisSeason
    };
    player.stints.push(season);
    player.careerTotals.pj += season.pj; player.careerTotals.pts += season.pts;
    player.careerTotals.reb += season.reb; player.careerTotals.ast += season.ast; player.careerTotals.stl += season.stl;
    seasonsCreated.push(season);
  }
  // Contract clock: ticks down by however many real years this cycle covered. Only NBA
  // contracts actually gate a forced renewal decision (see decideNextDecision), but keeping the
  // countdown running unconditionally means it's always accurate the moment a player signs
  // back into the NBA later in their career.
  player.contractYearsLeft = Math.max(0, (player.contractYearsLeft||0) - nYears);
  return seasonsCreated;
}

// Real FIBA windows alternate between the two big international tournaments -- naming it
// specifically (instead of a generic "torneo FIBA") is what makes a loss actually feel like
// something happened, instead of a silent no-op.
const FIBA_TOURNAMENT_NAMES = {olympic:'Juegos Olímpicos', world:'Mundial FIBA'};
function fibaTournamentName(){ return (G.calYear % 4 === 0) ? FIBA_TOURNAMENT_NAMES.olympic : FIBA_TOURNAMENT_NAMES.world; }
// "Juegos Olímpicos" is plural (los), "Mundial FIBA" is singular (el) -- picking the right
// article instead of hardcoding one keeps every generated sentence grammatically correct.
function fibaArticle(tournament){ return tournament===FIBA_TOURNAMENT_NAMES.olympic ? 'los' : 'el'; }
// When you don't medal, real FIBA/Olympic tournaments still end at a specific, nameable stage --
// surfacing that (instead of a blank "no medal") is the whole point of this fix.
function fibaEliminationStage(teamRes){
  if(teamRes.advance>=1) return 'Eliminado en octavos de final';
  if(!teamRes.madePlayoffs) return 'Eliminado en la fase de grupos';
  return 'Eliminado en octavos de final';
}
function playFIBA(player){
  const nat = NATIONALITIES.find(n=>n.name===player.nationality.name);
  const ov = overallRating(player.attrs);
  const teamRes = simulateTeamResult(ov, nat.fiba, 8, 5);
  const tournament = fibaTournamentName();
  let medal=null;
  if(teamRes.champion){ medal='Medalla de Oro FIBA'; }
  else if(teamRes.advance>=3){ medal='Medalla de Plata FIBA'; }
  else if(teamRes.advance>=2){ medal='Medalla de Bronce FIBA'; }
  const mvp = medal==='Medalla de Oro FIBA' && teamRes.bestOnTeam;
  const gp = randi(5,8);
  const stats = simulateSeasonStats(player, {leagueFactor:0.75, teamStrength:nat.fiba, experience:player.experienceCounter||0, age: player.age});
  // Quinteto Ideal del Torneo FIBA (All-Tournament Five): unlike the MVP -- which stays tied to
  // winning gold, like in real life -- this is based purely on individual performance, so a
  // standout player on a team that didn't medal can still earn it (as happens in real FIBA/
  // Olympic tournaments, where the all-tournament team often includes players from non-champion
  // rosters).
  const perfScore = ov*0.55 + stats.ppg*1.1 + stats.rpg*0.5 + stats.apg*0.6;
  const zAllTourney = awardZ(perfScore, 62, 7);
  const madeAllTourney = mvp || zAllTourney >= 1.6;
  if(medal){ player.nationalTeam.medals.push(medal); player.allAwards.push({label:`${seasonLabel(G.calYear)} · ${tournament}`, award:medal}); }
  if(mvp){ player.nationalTeam.medals.push('MVP del Torneo FIBA'); player.allAwards.push({label:`${seasonLabel(G.calYear)} · ${tournament}`, award:'MVP del Torneo FIBA'}); }
  if(madeAllTourney){ player.nationalTeam.medals.push('Quinteto Ideal del Torneo FIBA'); player.allAwards.push({label:`${seasonLabel(G.calYear)} · ${tournament}`, award:'Quinteto Ideal del Torneo FIBA'}); }
  player.nationalTeam.pj += gp; player.nationalTeam.pts += Math.round(stats.ppg*gp);
  player.nationalTeam.reb += Math.round(stats.rpg*gp); player.nationalTeam.ast += Math.round(stats.apg*gp);
  let injury = null;
  if(!player.injury && Math.random()<0.1) injury = triggerInjury(player);
  // Permanent record of every appearance -- medal or elimination -- so a loss actually shows up
  // somewhere (the retired screen's Selección card) instead of vanishing without a trace.
  const stageLabel = medal || fibaEliminationStage(teamRes);
  if(!player.nationalTeam.history) player.nationalTeam.history = [];
  player.nationalTeam.history.push({season: seasonLabel(G.calYear), tournament, result: stageLabel, medal: !!medal, mvp, allTourney: madeAllTourney});
  return {medal, mvp, madeAllTourney, tournament, stageLabel, injury};
}

/* ============================= DRAFT / OFFERS ============================= */
function computeDraftStock(player){
  const ov = overallRating(player.attrs);
  const lastStint = player.stints[player.stints.length-1];
  const production = lastStint ? (lastStint.pts/lastStint.pj*0.5 + lastStint.reb/lastStint.pj*0.3 + lastStint.ast/lastStint.pj*0.3) : 0;
  const ageBonus = (23-player.age)*2.2;
  // Noise kept modest on purpose: your OVR should be the dominant factor in where you get
  // picked, not a coin flip drowned out by randomness.
  return ov*0.55 + player.attrs.atletismo*0.18 + production*0.5 + ageBonus + rand(-4,4);
}
function pickFromStock(stock){ return clamp(Math.round(61 - stock*0.62), 1, 60); }
function rookieSalaryForPick(pick){
  if(pick<=30) return clamp(12.8 - (pick-1)*(12.8-2.3)/29, 2.2,13.5);
  return clamp(2.0 - (pick-31)*(2.0-1.0)/29, 0.9,2.1);
}
function nbaOfferForPick(pick){
  const teamsSorted = shuffle(NBA_TEAMS);
  const team = teamsSorted[Math.min(pick-1,29)%30];
  return {team, pick, salary: rookieSalaryForPick(pick), years: pick<=30?4:2, round: pick<=30?1:2};
}
function intlOffer(player, league){
  const ov = overallRating(player.attrs);
  let teams, base;
  if(league==='EuroLiga'){ teams=EURO_TEAMS; base = clamp(0.15+(ov-50)/49*3.35,0.08,3.6); }
  else if(league==='CBA'){ teams=CBA_TEAMS; base = clamp(0.3+(ov-50)/49*4.7,0.15,5.2); }
  else { teams=OTHER_TEAMS; base = clamp(0.05+(ov-50)/49*1.2,0.03,1.3); }
  const team = choice(teams);
  return {team, years:randi(1,3), salary:base*clamp(gauss(1,0.15),0.7,1.3), league};
}
function veteranNBAOffer(player){
  const ov = overallRating(player.attrs);
  const base = clamp(2 + (ov-50)/49*38, 1, 45) * clamp(gauss(1,0.1),0.75,1.2);
  const team = choice(NBA_TEAMS.filter(t=>t.abbr !== (player.currentTeamObj&&player.currentTeamObj.abbr)));
  return {team, years:randi(1,4), salary:clamp(base,1,45), league:'NBA'};
}

/* ============================= LEGACY ============================= */
function computeLegacy(player){
  let legacy=0;
  for(const a of player.allAwards) legacy += AWARD_WEIGHTS[a.award]||0;
  legacy += Math.min(player.careerTotals.pts/2800, 9);
  legacy += Math.min(player.stints.length*0.7, 7);
  return Math.round(legacy*10)/10;
}
function hofVerdict(legacy){
  if(legacy>=95) return {tier:'🐐 Ícono histórico del básquet', color:'var(--gold)'};
  if(legacy>=65) return {tier:'🏛️ Salón de la Fama (primera votación)', color:'var(--gold)'};
  if(legacy>=42) return {tier:'⭐ Candidato fuerte al Salón de la Fama', color:'var(--text)'};
  if(legacy>=24) return {tier:'👍 Buena carrera, gran nombre de la liga', color:'var(--text)'};
  if(legacy>=10) return {tier:'📋 Carrera sólida de rol', color:'var(--muted)'};
  return {tier:'📉 Carrera modesta', color:'var(--muted)'};
}

/* ============================= DECISION FLOW ============================= */
function makeCollegeOffers(){
  const picks = pickN(COLLEGES, 3);
  return picks.map(c=>({kind:'college', team:c}));
}
function makeDraftOffers(player){
  const stock = computeDraftStock(player);
  // pickFromStock is a continuous, monotonic mapping from your actual draft stock (built from
  // OVR, athleticism, production and age) straight to a pick number 1-60 — a truly elite
  // prospect lands near pick 1, a fringe one lands in the 50s, nothing in between is arbitrary.
  // A little jitter around that anchor keeps some draft-night unpredictability without ever
  // letting a weak prospect go #1 or a generational one slide to #50.
  const anchor = pickFromStock(stock);
  const jitterSpread = anchor<=14 ? 3 : anchor<=35 ? 5 : 4;
  const rawPicks = [anchor + randi(-1,1), anchor + randi(1,jitterSpread), anchor + randi(-jitterSpread,-1)];
  const picks = [...new Set(rawPicks.map(p=>clamp(p,1,60)))].sort((a,b)=>a-b);
  const opts = picks.map(p=>({kind:'nba', offer: nbaOfferForPick(p)}));
  // Weaker prospects also get a realistic international fallback path (and the very weakest
  // get two), same as before.
  if(anchor>20) opts.push({kind:'intl', offer: intlOffer(player,'EuroLiga')});
  if(anchor>40) opts.push({kind:'intl', offer: intlOffer(player,'CBA')});
  return opts;
}
function makeTransferOffers(player){
  const opts = [];
  const leagues = ['NBA','EuroLiga','CBA','Otra'].filter(l=>l!==player.currentTeamObj.league);
  const pickLeagues = pickN(leagues, randi(1,2));
  for(const l of pickLeagues){
    if(l==='NBA') opts.push({kind:'nba', offer: veteranNBAOffer(player)});
    else opts.push({kind:'intl', offer: intlOffer(player,l)});
  }
  opts.push({kind:'stay', team: player.currentTeamObj});
  return opts;
}
// Offers shown specifically after declining to renew an NBA contract (real free agency): unlike
// the generic makeTransferOffers above, these always include other NBA teams as a real option
// (not just a one-way ticket out of the league), plus a couple of international offers for
// variety. No "stay" card here — you already turned down the option to stay.
function makeFreeAgentOffers(player){
  const opts = [];
  opts.push({kind:'nba', offer: veteranNBAOffer(player)});
  if(Math.random()<0.7) opts.push({kind:'nba', offer: veteranNBAOffer(player)});
  const intlLeagues = pickN(['EuroLiga','CBA','Otra'], randi(1,2));
  for(const l of intlLeagues) opts.push({kind:'intl', offer: intlOffer(player,l)});
  return opts;
}

function applyStatEffects(p, eff){
  if(!eff) return;
  if(eff.money) p.money = Math.max(0, Math.round(((p.money||0)+eff.money)*100)/100);
  if(eff.fama) p.fama = Math.max(0, Math.round((p.fama||0)+eff.fama));
  if(eff.forma) p.forma = clamp(Math.round((p.forma==null?60:p.forma)+eff.forma), 5, 99);
  if(eff.moral) p.moral = clamp(Math.round((p.moral==null?75:p.moral)+eff.moral), 5, 99);
  if(eff.hinchada) p.hinchada = clamp(Math.round((p.hinchada==null?55:p.hinchada)+eff.hinchada), 5, 99);
}

/* ============================= TIENDA (SHOP) =============================
   Spend salary money on things that actually change your career, not just flavor text:
   - Coleccionables (auto/reloj/ropa/casa): one-time buys, owned forever, give an immediate
     permanent bump to fama/hinchada/moral (lifestyle upgrades a real athlete would show off).
   - Energía: a repeatable consumable — instant forma refill, buy it as many times as you can
     afford (forma still decays back toward baseline every season like always).
   - Salud (medical staff): a persistent upgrade track (levels 1-3) that directly lowers your
     real chance of getting injured every season from here on — read straight out of the
     injury-roll in simulateStint.
   - Campaña de prensa: a one-shot media push that gives your MVP case a real numeric boost
     (added straight into the same z-score check that decides the MVP award) for your very
     next stint, then it's spent. */

function shopHealthLevel(p){ return (p.shop&&p.shop.healthLevel)||0; }
function shopInjuryReduction(p){
  const lvl = shopHealthLevel(p);
  return lvl>0 ? SHOP_HEALTH_LEVELS[lvl-1].reduction : 0;
}
function buyCollectible(id){
  const p = G.player; migratePlayer(p);
  const item = SHOP_COLLECTIBLES.find(i=>i.id===id);
  if(!item || p.shop.owned.includes(id) || (p.money||0) < item.cost) return;
  applyStatEffects(p, Object.assign({money:-item.cost}, item.effect));
  p.shop.owned.push(id);
  sfxSuccess();
  G._flash = `Compraste: ${item.name}. 🛍️`;
  G.overlay = shopOverlayHTML(p);
  render();
}
function buyEnergy(id){
  const p = G.player; migratePlayer(p);
  const item = SHOP_ENERGY.find(i=>i.id===id);
  if(!item || (p.money||0) < item.cost) return;
  applyStatEffects(p, {money:-item.cost, forma:item.forma});
  sfxSuccess();
  G._flash = `Compraste: ${item.name}. ⚡`;
  G.overlay = shopOverlayHTML(p);
  render();
}
function buyHealthUpgrade(){
  const p = G.player; migratePlayer(p);
  const cur = shopHealthLevel(p);
  const next = SHOP_HEALTH_LEVELS[cur];
  if(!next || (p.money||0) < next.cost) return;
  applyStatEffects(p, {money:-next.cost});
  p.shop.healthLevel = next.level;
  sfxSuccess();
  G._flash = `Contrataste: ${next.name}. Menos riesgo de lesión de acá en más. 🩺`;
  G.overlay = shopOverlayHTML(p);
  render();
}
function buyMvpCampaign(level){
  const p = G.player; migratePlayer(p);
  const item = SHOP_MVP_LEVELS.find(i=>i.level===level);
  if(!item || (p.money||0) < item.cost) return;
  applyStatEffects(p, {money:-item.cost});
  p.shop.mvpCharge = Math.max(p.shop.mvpCharge||0, item.boost);
  sfxSuccess();
  G._flash = `Contrataste: ${item.name}. Tu candidatura al MVP recibe un empujón esta temporada. 📣`;
  G.overlay = shopOverlayHTML(p);
  render();
}

function effectPillsHTML(eff){
  if(!eff) return '';
  const parts = [];
  if(eff.fama) parts.push(`<span class="shopPill up">+${eff.fama} Fama</span>`);
  if(eff.hinchada) parts.push(`<span class="shopPill up">+${eff.hinchada} Hinchada</span>`);
  if(eff.moral) parts.push(`<span class="shopPill up">+${eff.moral} Moral</span>`);
  if(eff.forma) parts.push(`<span class="shopPill up">+${eff.forma} Forma</span>`);
  return parts.join('');
}

function resolveFamaChoiceIdx(i){
  startSuspense('Resolviendo la situación...', ()=>resolveFamaChoiceIdxNow(i));
}
function resolveFamaChoiceIdxNow(i){
  const dec = G.player.pendingDecision;
  const ev = dec && dec.event;
  if(!ev) return;
  const opt = ev.options[i];
  applyStatEffects(G.player, opt.effects);
  G._flash = opt.flash;
  const hasGain = opt.effects && Object.values(opt.effects).some(v=>v>0);
  const hasLoss = opt.effects && Object.values(opt.effects).some(v=>v<0);
  if(hasGain && !hasLoss) sfxSuccess(); else if(hasLoss && !hasGain) sfxFail();
  finishStintAndAdvance();
}
function resolveCaptain(accept){
  if(!accept){ resolveCaptainNow(false); return; }
  startSuspense('Asumiendo la cinta de capitán...', ()=>resolveCaptainNow(true));
}
function resolveCaptainNow(accept){
  const p = G.player;
  if(accept){
    if(Math.random()<0.62){
      applyStatEffects(p,{moral:8,hinchada:6,fama:4});
      G._flash = 'Te pusiste el brazalete de capitán y el vestuario respondió. El grupo se siente más sólido. 🧢';
      sfxSuccess();
    } else {
      applyStatEffects(p,{moral:-6,forma:-4});
      G._flash = 'La presión de liderar un año difícil te pasó factura. 📉';
      sfxFail();
    }
  } else {
    G._flash = 'Preferiste no llevar la cinta de capitán este año. Nadie te lo reprocha.';
  }
  finishStintAndAdvance();
}
function resolveInvestment(doIt){
  if(!doIt){ resolveInvestmentNow(false); return; }
  startSuspense('Cerrando la inversión...', ()=>resolveInvestmentNow(true));
}
function resolveInvestmentNow(doIt){
  const p = G.player;
  if(doIt){
    const stake = Math.max(0.3, Math.round((p.money||0)*0.35*100)/100);
    if(Math.random()<0.5){
      const gain = Math.round(stake*rand(0.8,2.2)*100)/100;
      applyStatEffects(p,{money:gain});
      G._flash = `¡El negocio despegó! Convertiste ${fmtMoney(stake)} en ${fmtMoney(stake+gain)}. 💰`;
      sfxSuccess();
    } else {
      applyStatEffects(p,{money:-stake});
      G._flash = `El negocio no funcionó. Perdiste los ${fmtMoney(stake)} que invertiste. 📉`;
      sfxFail();
    }
  } else {
    G._flash = 'Preferiste no arriesgar tus ahorros esta vez.';
  }
  finishStintAndAdvance();
}
function resolveRivalry(fireBack){
  if(!fireBack){ resolveRivalryNow(false); return; }

}

// Precomputed so the "Renovar" card can show the real years/salary-change offer up front,
// same idea as any other offer card (draft/transfer show numbers before you pick) -- resolving
// the choice later just applies this exact same offer instead of re-rolling something new.
function makeRenewOffer(){
  return {years: randi(1,4), mult: clamp(gauss(1.05,0.14),0.72,1.45)};
}
function decideNextDecision(player){
  if(player.stage==='college'){
    if((player.collegeYearsPlayed||0)<4){
      return {type:'college_stay', title:'Concentración extra', desc:'Una temporada más en la misma universidad. Un entrenamiento especial puede potenciarte, pero el esfuerzo también puede pasarte factura.'};
    } else {
      return {type:'draft', title:'El Draft de la NBA', desc:'Terminaste tu paso por la universidad. Estos son los destinos que se interesaron por vos.'};
    }
  }
  const age = player.age;
  const canRetire = age>=30;
  if(age>=MAX_AGE-2){
    // Push firmly toward wrapping up the career as the age cap approaches.
    return {type:'transfer', title:'Fin de ciclo', desc:'Tu cuerpo ya no responde como antes. Elegí un último destino o colgá los botines.', canRetire:true};
  }
  // Contract clock hit zero: this is now GUARANTEED, not a dice roll -- a signed deal for N
  // years means you actually play out those N years with this team, then a real renewal
  // (for more or less money), a trade request, or free agency is forced, never silently skipped.
  if(player.currentTeamObj && player.currentTeamObj.league==='NBA' && (player.contractYearsLeft||0)<=0){
    return {type:'contract', title:'Fin de contrato', desc:'Se termina tu contrato con el equipo. ¿Renovás, pedís un trade, o preferís no renovar y salir al mercado como agente libre?', canRetire, renewOffer: makeRenewOffer()};
  }
  const roll = Math.random();
  if(roll<0.07 && age<38){
    return {type:'fiba', title:`Ventana FIBA — ${fibaTournamentName()}`, desc:`¿Querés representar a ${player.nationality.name} en ${fibaArticle(fibaTournamentName())==='los'?'los próximos':'el próximo'} ${fibaTournamentName()}?`};
  } else if(roll<0.21 || (canRetire && Math.random()<0.35)){
    // Once you're in the NBA, you don't get to freely shop yourself around every cycle like in
    // the other leagues — you either renew, ask for a trade (the team sends you somewhere, you
    // don't pick), or decline your contract and THEN become a real free agent with open offers.
    if(player.currentTeamObj && player.currentTeamObj.league==='NBA'){
      return {type:'contract', title:'Fin de contrato', desc:'Se termina tu contrato con el equipo. ¿Renovás, pedís un trade, o preferís no renovar y salir al mercado como agente libre?', canRetire, renewOffer: makeRenewOffer()};
    }
    return {type:'transfer', title:'Mercado de pases', desc:'Llegaron ofertas de otros clubes. Podés aceptar una, quedarte en tu equipo actual, o retirarte si ya diste todo.', canRetire};
  } else if(roll<0.31){
    return {type:'minutes', title:'Rol en el equipo', desc:'El cuerpo técnico te pregunta cómo encarar la próxima temporada: subir tu carga de minutos y tu promedio, o cuidar el cuerpo jugando menos.'};
  } else if(roll<0.39){
    return {type:'tattoo', title:'Tatuaje gigante', desc:'Un artista reconocido te ofrece un tatuaje enorme antes de la temporada. Es una declaración de estilo... y de riesgo.'};
  } else if(roll<0.47){
    return {type:'endorsement', title:'Oferta de sponsor', desc:'Una marca importante te propone ser la imagen de su próxima campaña publicitaria.'};
  } else if(roll<0.57){
    return {type:'doping', title:'Suplemento en la sombra', desc:'Un preparador físico te ofrece un suplemento no aprobado que promete una mejora rápida de rendimiento. Es ilegal y hay controles antidopaje.'};
  } else if(roll<0.66){
    return {type:'captain', title:'La cinta de capitán', desc:'El entrenador te ofrece ser el capitán del equipo esta temporada. Es un honor, pero también más presión encima si las cosas se complican.'};
  } else if(roll<0.75){
    return {type:'investment', title:'Propuesta de negocios', desc:'Un agente te propone invertir parte de tus ahorros en un emprendimiento fuera de la cancha. Puede multiplicar tu plata... o no.'};
  } else if(roll<0.84){
    return {type:'rivalry', title:'Rivalidad caliente', desc:'Un rival te tiró una provocación fuerte antes del partido de esta semana. Las cámaras están esperando tu reacción.'};
  } else if(roll<0.94){
    const ev = pickFamaEvent();
    return {type:'fama', title:ev.title, desc:ev.desc, kicker:ev.kicker, event:ev};
  } else {
    return {type:'gamble', title:'Concentración extra', desc:'Una concentración especial puede potenciarte, pero el esfuerzo también puede pasarte factura.'};
  }
}

function resolveCollegeChoice(collegeTeam){
  G._pendingOffers = null;
  G.player.currentTeamObj = collegeTeam;
  finishStintAndAdvance();
}
function resolveDraftChoice(opt){
  const p = G.player;
  p.stage = 'pro';
  if(opt.kind==='nba'){
    p.currentTeamObj = opt.offer.team;
    p._firstProLeagueIsNBA = true;
    p._draftInfo = {pick:opt.offer.pick, round:opt.offer.round, salary:opt.offer.salary};
    p.currentSalary = opt.offer.salary;
    p.contractYearsLeft = randi(2,4); // rookie-scale deal length
  } else {
    p.currentTeamObj = opt.offer.team;
    p._draftInfo = {pick:null, round:null, salary:opt.offer.salary};
    p.currentSalary = opt.offer.salary;
    p.contractYearsLeft = randi(1,3);
  }
  finishStintAndAdvance();
}
function resolveTransferChoice(opt){
  const p = G.player;
  if(opt.kind==='stay'){
    // Re-signing with your own club: a modest raise, and a small loyalty bump to the fanbase.
    p.currentSalary = Math.max(p.currentSalary||0.5, (p.currentSalary||0.5) * clamp(gauss(1.08,0.06),0.95,1.25));
    p.hinchada = clamp(Math.round((p.hinchada==null?55:p.hinchada) + rand(1,4)), 5, 99);
    p.contractYearsLeft = randi(1,3);
  } else {
    p.currentTeamObj = opt.offer.team;
    p.currentSalary = opt.offer.salary;
    p.contractYearsLeft = opt.kind==='nba' ? randi(2,4) : randi(1,3);
  }
  finishStintAndAdvance();
}
/* ---- NBA contract resolution: renew / request trade / decline (see decideNextDecision) ----
   Once you're in the NBA you don't get to freely browse offers every cycle anymore — you renew
   with your team, ask them to trade you (they pick the destination, not you), or decline and
   THEN become a real free agent with actual offers on the table. */
function resolveContractRenew(){
  const p = G.player;
  // Apply the EXACT offer already shown on the "Renovar" card (see decideNextDecision's
  // renewOffer + the offerCard osub text) rather than rolling something different now --
  // real negotiation swing: usually a raise, but a real chance of a flat or reduced offer too
  // (e.g. if your recent form/impact didn't justify a bump) -- "más o menos plata", not just up.
  const offer = (p.pendingDecision && p.pendingDecision.renewOffer) || makeRenewOffer();
  const salaryMult = offer.mult;
  const years = offer.years;
  p.currentSalary = Math.max(0.4, (p.currentSalary||0.5) * salaryMult);
  p.hinchada = clamp(Math.round((p.hinchada==null?55:p.hinchada) + rand(1,4)), 5, 99);
  p.contractYearsLeft = years;
  const pctChange = Math.round((salaryMult-1)*100);
  const changeTxt = pctChange>=0 ? `+${pctChange}%` : `${pctChange}%`;
  G._flash = `Renovaste contrato con ${p.currentTeamObj.name} por ${years} año${years>1?'s':''} (${changeTxt} en tu salario). 🤝`;
  finishStintAndAdvance();
}
function resolveContractTrade(){
  const p = G.player;
  const candidates = NBA_TEAMS.filter(t=>t.abbr !== p.currentTeamObj.abbr);
  const dest = choice(candidates);
  const oldTeamName = p.currentTeamObj.name;
  p.currentTeamObj = dest;
  // A trade carries your existing salary over (with a little variance), unlike a fresh
  // free-agent contract — that's how real in-league trades work.
  p.currentSalary = clamp((p.currentSalary||1) * clamp(gauss(1,0.08),0.85,1.15), 0.9, 45);

  p.contractYearsLeft = Math.max(1, p.contractYearsLeft||randi(1,3));

/* ---- Suspense wrapper: shows a brief "rolling" beat before a risky decision's

function resolveGamble(doIt){

function resolveGambleNow(doIt){

    if(Math.random()<successChance){ applyGambleDelta(p, rand(3,6)); applyStatEffects(p,{forma:6}); G._flash='¡La concentración especial dio resultado! 📈'; sfxSuccess(); }
    else { applyGambleDelta(p, -rand(2,5)); applyStatEffects(p,{forma:-6}); G._flash='El esfuerzo pasó factura este año. 📉'; sfxFail(); }
  }

function resolveFiba(yes){

var SIM_DELAY_MS = 900;
// Awards shown in the little "you just won something" popup (anything NOT already
// covered by the big gold championship reveal, so the two don't overlap/duplicate).
const AWARD_POPUP_LIST = NOTABLE_AWARDS.concat(['Campeón de la Copa NBA','MVP de la Copa NBA']);
function finishStintAndAdvanceNow(){
  const p = G.player;
  let seasons;
  if(p.stage==='college'){
    seasons = simulateCollegeStint(p);
  } else {
    seasons = simulateStint(p);
  }
  G.calYear += seasons.length;
  const champSeason = seasons.slice().reverse().find(s=>s.champion);
  const popupAwards = [];
  for(const s of seasons){
    for(const aw of s.trophies){
      if(AWARD_POPUP_LIST.includes(aw)) popupAwards.push({award:aw, team:s.team.name});
    }
  }
  if(champSeason){
    G._flash = championFlashMessage(champSeason);
    G._justWonTitle = {team: champSeason.team, league: champSeason.league};
    sfxCrowd();
  }
  if(popupAwards.length){ G._justWonAwards = popupAwards; if(!champSeason) sfxSuccess(); }
  if(p.age>=MAX_AGE){
    finalizeRetirement(p);
    G.screen = 'retired';
    return;
  }
  p.pendingDecision = decideNextDecision(p);
}
function finishStintAndAdvance(){
  const p = G.player;
  const teamName = p.currentTeamObj ? p.currentTeamObj.name : (p.nationality?p.nationality.name:'');
  G.simulating = {team: teamName};
  render();
  const run = ()=>{
    finishStintAndAdvanceNow();
    G.simulating = null;
    render();
  };
  if(SIM_DELAY_MS<=0){ run(); } else { setTimeout(run, SIM_DELAY_MS); }
}
function simulateCollegeStint(player){
  // Same fix as the pro simulator: each year is its own season row, capped at
  // one real college season's worth of games.
  const team = player.currentTeamObj;
  const seasonsCreated = [];
  const nYears = yearsPerCycle(player);
  for(let yr=0; yr<nYears; yr++){
    const stats = simulateSeasonStats(player, {leagueFactor: leagueFactor('NCAA'), teamStrength: team.prestige, experience: player.collegeYearsPlayed||0});
    const teamRes = simulateTeamResult(overallRating(player.attrs), team.prestige, leagueGames('NCAA'), leagueRounds('NCAA'));
    const seasonScore = overallRating(player.attrs)*0.6 + (teamRes.wins/30)*20 + rand(-4,4);
    const awards = computeSeasonAwards({league:'NCAA', seasonScore, stats, teamRes, isRookie:false, lastSeasonScore:null, attrs:player.attrs});
    for(const aw of awards){
      player.allAwards.push({label:`${seasonLabel(G.calYear+yr)} · ${team.name}`, award:aw});
    }
    const champion = !!teamRes.champion;
    const regGp = Math.round(30*clamp(gauss(0.9,0.06),0.6,1));
    const roundsPlayed = teamRes.madePlayoffs ? Math.min(teamRes.advance+1, leagueRounds('NCAA')) : 0;
    const playoffGp = roundsPlayed>0 ? Math.round(roundsPlayed*leagueGamesPerRound('NCAA')) : 0;
    const gp = regGp + playoffGp;
    const seasonAgeStart = player.age;
    player.age += 1;
    player.collegeYearsPlayed = (player.collegeYearsPlayed||0)+1;
    passiveGrowth(player); // every real season now, not just once per cycle
    const season = {
      ageStart: seasonAgeStart, team, league:'NCAA',
      ovrEnd: Math.round(overallRating(player.attrs)),
      pj: gp, pts: Math.round(stats.ppg*gp), reb: Math.round(stats.rpg*gp), ast: Math.round(stats.apg*gp),
      stl: Math.round(stats.spg*gp), blk: Math.round(stats.bpg*gp),
      trophies: awards.slice(), champion
    };
    player.stints.push(season);
    player.careerTotals.pj += season.pj; player.careerTotals.pts += season.pts;
    player.careerTotals.reb += season.reb; player.careerTotals.ast += season.ast; player.careerTotals.stl += season.stl;
    seasonsCreated.push(season);
  }
  return seasonsCreated;
}

function saveGame(){

// Any save made before a given feature existed simply won't have that field on the player
// object — reading straight into it (like p.shop.owned) throws and silently breaks whatever
// button triggered it. This patches in safe defaults for older saves so nothing crashes.
function migratePlayer(p){
  if(!p) return p;
  if(!p.shop) p.shop = {owned:[], healthLevel:0, mvpCharge:0};
  if(!Array.isArray(p.shop.owned)) p.shop.owned = [];
  if(p.shop.healthLevel==null) p.shop.healthLevel = 0;
  if(p.shop.mvpCharge==null) p.shop.mvpCharge = 0;
  // Older saves predate the contract-years tracker -- give any in-progress NBA player a few
  // fresh years instead of forcing an immediate "fin de contrato" the very next cycle.
  if(p.contractYearsLeft==null) p.contractYearsLeft = randi(1,3);
  // Older saves predate the FIBA appearance history log.
  if(p.nationalTeam && !Array.isArray(p.nationalTeam.history)) p.nationalTeam.history = [];
  return p;
}
function loadGame(){
  const raw = localStorage.getItem('leyenda_nba_save_v2');
  if(raw){
    try{
      G = JSON.parse(raw);
      if(G && G.player) migratePlayer(G.player);
      return true;
    }catch(e){ return false; }
  }
  return false;
}
function resetGame(){
  if(confirm('¿Seguro que querés borrar tu progreso y empezar de nuevo?')){
    localStorage.removeItem('leyenda_nba_save_v2');
    G = freshState();

  }
}

const LEADERBOARD_KEY = 'leyenda_nba_leaderboard_v1';
const LEADERBOARD_MAX = 50;
function loadLeaderboard(){
  try{
    const raw = localStorage.getItem(LEADERBOARD_KEY);

  }catch(e){ return []; }

function buildLeaderboardEntry(p){
  const pj = p.careerTotals.pj||0;
  const verdict = hofVerdict(p.legacy||0);
  const teams = [...new Set(p.stints.map(s=>s.team.name))];
  const titles = p.stints.filter(s=>s.league==='NBA' && s.champion).length;
  const mvps = p.allAwards.filter(a=>a.award==='MVP de la NBA').length;
  const allStars = p.allAwards.filter(a=>a.award==='All-Star').length;
  return {
    name: p.name, position: p.position, ovr: Math.round(overallRating(p.attrs)),
    legacy: p.legacy||0, verdictTier: verdict.tier, verdictColor: verdict.color,
    ppg: pj>0 ? Math.round((p.careerTotals.pts/pj)*10)/10 : 0,
    rpg: pj>0 ? Math.round((p.careerTotals.reb/pj)*10)/10 : 0,
    apg: pj>0 ? Math.round((p.careerTotals.ast/pj)*10)/10 : 0,
    pj, titles, mvps, allStars, teams,
    nationality: p.nationality ? p.nationality.name : '',
    savedAt: Date.now()
  };
}
function uploadCareer(){
  const p = G.player;
  if(!p || !p.retired) return;
  const list = loadLeaderboard();
  list.push(buildLeaderboardEntry(p));
  list.sort((a,b)=>b.legacy-a.legacy);
  saveLeaderboard(list.slice(0, LEADERBOARD_MAX));
  p._uploadedToLeaderboard = true;
  flashMsg('Carrera subida al ranking ✅');

// Builds a plain-text career recap for sharing outside the game (chat apps, socials, clipboard).

  lines.push(`🏀 ${p.name} #${p.number} (${p.position}) — Leyenda NBA`);
  lines.push(entry.verdictTier);
  lines.push(`${fmt1(entry.ppg)} PPG · ${fmt1(entry.rpg)} RPG · ${fmt1(entry.apg)} APG en ${fmtInt(entry.pj)} partidos`);
  if(entry.titles>0) lines.push(`🏆 ${entry.titles} título${entry.titles>1?'s':''} de la NBA`);

// Uses the native share sheet when available (mobile browsers); falls back to copying the
// recap to the clipboard so it can be pasted anywhere (desktop, or if sharing is unsupported).
// The link is read from the page's own URL, so it always points at wherever this game is
// actually hosted (e.g. once published to GitHub Pages) instead of a hardcoded address.
async function shareCareer(){
  const p = G.player;
  if(!p || !p.retired) return;
  const text = shareCareerText(p);
  const url = (typeof location!=='undefined' && location.href) ? location.href : '';
  if(typeof navigator!=='undefined' && navigator.share){
    try{ await navigator.share({title:'Mi carrera en Leyenda NBA', text, url}); return; }
    catch(e){ /* user cancelled the share sheet, or it's unsupported here -- fall back below */ }
  }
  const fullText = url ? `${text}\n${url}` : text;
  try{
    await navigator.clipboard.writeText(fullText);

  }catch(e){

/* ============================= RENDER: helpers ============================= */
function shadeColor(hex, pct){
  hex = (hex||'#333333').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  r = clamp(Math.round(r + (pct>0? (255-r)*pct : r*pct)),0,255);
  g = clamp(Math.round(g + (pct>0? (255-g)*pct : g*pct)),0,255);
  b = clamp(Math.round(b + (pct>0? (255-b)*pct : b*pct)),0,255);
  return `rgb(${r},${g},${b})`;
}
let _crestSeq = 0;

/* ---- Small league badge (distinct from team crests) shown next to league names ---- */
// Real official NBA logo, hotlinked from the NBA's own Wikipedia article (a clean,
// non-free-fair-use SVG render) instead of a hand-cleaned embedded copy, consistent with
// every other league/crest image in the game. NOTE: Wikimedia restricts this specific file
// to a small whitelist of thumbnail widths (anti-hotlink-abuse measure on heavily-used logos) —

function leagueBadgeHTML(league, px, teamAbbr){
  const s = px||16;
  const realLogo = league==='NBA' ? NBA_LOGO_URL
    : league==='EuroLiga' ? EURO_LEAGUE_LOGO
    : league==='CBA' ? CBA_LEAGUE_LOGO
    : league==='NCAA' ? NCAA_LEAGUE_LOGO
    : (league==='Otra' && teamAbbr && OTHER_LEAGUE_LOGO_URLS[teamAbbr]) ? OTHER_LEAGUE_LOGO_URLS[teamAbbr]
    : null;
  if(realLogo){
    const fallback = leagueBadgeSvgOnly(league, s);
    // NBA's real logo (the classic blue/red "logoman" box) is actually noticeably TALLER than
    // wide (confirmed ~0.44 width:height ratio), unlike the other roughly-circular league badges,
    // so it gets a bit more height and less width instead of being squeezed into a square slot.
    const h = league==='NBA' ? Math.round(s*1.3) : s;
    const w = league==='NBA' ? Math.max(Math.round(h*0.44), 9) : s;
    return `<span style="display:inline-flex;width:${w}px;height:${h}px;flex-shrink:0;align-items:center;justify-content:center;vertical-align:middle">

    </span>`;
  }

}

/* Trophy row icons: clickable/tappable (not just hover-title) so it's clear on mobile too
   what each little icon means — tapping flashes the award's full name. Repeated awards (e.g.
   All-Star 4 different seasons) collapse to one icon with a small "×N" count badge instead of
   showing the same icon N separate times or silently hiding the repeat count. */
function trophyIconsHTML(list, max){
  const counts = {};
  const order = [];
  for(const a of list){ if(!(a in counts)){ counts[a] = 0; order.push(a); } counts[a]++; }
  // Sort by real-world importance first (stable, so equal-priority ties keep their original
  // chronological order) so the cutoff below never hides the biggest trophy you won.
  order.sort((a,b)=>(AWARD_PRIORITY[b]||10)-(AWARD_PRIORITY[a]||10));
  const shown = order.slice(0, max||6);
  return shown.map(a=>{
    const meta = AWARD_ICON_META[a] || {type:'ribbon',color:'#ccc'};
    const n = counts[a];
    const label = n>1 ? `${a} ×${n}` : a;
    const jsSafe = esc(String(label).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
    const badge = n>1 ? `<span class="icCount">×${n}</span>` : '';
    return `<span class="ic" data-tip="${esc(label)}" onclick="flashMsg('${jsSafe}')">${iconSVG(meta.type, meta.color, 19)}${badge}</span>`;
  }).join('');
}

// Real career per-game averages (PPG/RPG/APG), researched (not guessed) from actual NBA

const HISTORICAL_COMPS = [
