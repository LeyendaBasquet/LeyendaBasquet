// Matches the retired player's own career PPG/RPG/APG against the roster above using a
// normalized Euclidean distance (divisors sized to each stat's typical career-average spread),
// with a small distance discount when the archetype's real position overlaps the player's own --
// so a close stat-line at the same position wins over an equally-close one at a different spot.
function findHistoricalComp(p){
  const pj = p.careerTotals.pj||0;
  if(pj<=0) return null;
  const ppg = p.careerTotals.pts/pj, rpg = p.careerTotals.reb/pj, apg = p.careerTotals.ast/pj;
  let best=null, bestDist=Infinity;
  for(const c of HISTORICAL_COMPS){
    const dPts=(ppg-c.pts)/8, dReb=(rpg-c.reb)/5, dAst=(apg-c.ast)/4;
    let dist=Math.sqrt(dPts*dPts+dReb*dReb+dAst*dAst);
    if(c.pos.includes(p.position)) dist*=0.85;
    if(dist<bestDist){ bestDist=dist; best=c; }
  }
  return best ? {comp:best, ppg, rpg, apg} : null;
}

/* ============================= RÉCORDS Y CAMISETA RETIRADA ============================= */
// Real, well-known all-time NBA records (researched, kept current as of mid-2026) used as
// thresholds -- if the fictional in-game career clears one, it's called out as flavor text.
// Small minimum-games guards avoid a short/lucky stretch reading as a "record" fluke.
function checkRecords(p){
  const out = [];
  const pj = p.careerTotals.pj||0;
  const ppg = pj>0 ? p.careerTotals.pts/pj : 0;
  if(pj>=300 && ppg>=30.2) out.push(`Terminaste con ${fmt1(ppg)} puntos por partido de por vida, superando el promedio más alto de la historia de la NBA (Michael Jordan, 30.1).`);
  if(p.careerTotals.pts>=43441) out.push(`Anotaste ${fmtInt(p.careerTotals.pts)} puntos en tu carrera, el total más alto de la historia de la NBA (por encima de LeBron James, 43.440).`);
  const nbaTitles = p.stints.filter(s=>s.league==='NBA' && s.champion).length;
  if(nbaTitles>=12) out.push(`Ganaste ${nbaTitles} títulos de la NBA, más que cualquier jugador de la historia (Bill Russell, 11 anillos).`);
  const mvps = p.allAwards.filter(a=>a.award==='MVP de la NBA').length;
  if(mvps>=7) out.push(`Ganaste ${mvps} premios MVP de la NBA, superando el récord histórico (Kareem Abdul-Jabbar, 6).`);
  const allStars = p.allAwards.filter(a=>a.award==='All-Star').length;
  if(allStars>=23) out.push(`Fuiste All-Star ${allStars} veces, el mayor número de la historia de la NBA (por encima de LeBron James, 22).`);
  return out;
}
// A team "retires your jersey" when you spent a long time there (8+ temporadas) AND achieved
// something real with that specific team (a título there, or repetidos premios individuales
// mientras jugabas ahí) -- reusing the same allAwards labels (which already embed the team name
// after " · ") to attribute individual honors to the right team.
function checkRetiredJerseys(p, byTeam){
  const awardsByTeamName = {};
  for(const a of p.allAwards){
    if(!NOTABLE_AWARDS.includes(a.award)) continue;
    const parts = String(a.label||'').split(' · ');
    const teamPart = parts[1] ? parts[1].trim() : '';
    if(teamPart) awardsByTeamName[teamPart] = (awardsByTeamName[teamPart]||0)+1;
  }
  const out = [];
  for(const key in byTeam){
    const t = byTeam[key];
    const teamAwards = awardsByTeamName[key]||0;
    if((t.seasons||0)>=8 && (t.titles>0 || teamAwards>=3)) out.push(t.team);
  }
  return out;
}

function championSummaryHTML(p){
  const nbaChampionStints = p.stints.filter(s=>s.league==='NBA' && s.champion);
  const otherTitleStints = p.stints.filter(s=>s.league!=='NBA' && s.champion);
  if(nbaChampionStints.length>0){
    // Pull the actual season each ring was won in straight from the allAwards labels (which
    // already embed "<season> · <team>"), the same mechanism used for individual-award seasons.
    const champSeasonsByTeam = {};
    for(const a of p.allAwards){
      if(a.award !== 'Campeón de la NBA') continue;
      const parts = String(a.label||'').split(' · ');
      const teamName = parts[1] ? parts[1].trim() : '';
      const season = parts[0] ? parts[0].trim() : '';
      if(!teamName) continue;
      (champSeasonsByTeam[teamName] = champSeasonsByTeam[teamName]||[]).push(season);
    }
    const byTeam = {};
    for(const s of nbaChampionStints){
      if(!byTeam[s.team.name]) byTeam[s.team.name] = {team:s.team, count:0};
      byTeam[s.team.name].count++;
    }
    const chips = Object.values(byTeam).map(t=>{
      const seasons = (champSeasonsByTeam[t.team.name]||[]).join(', ');
      return `<span class="ringChip" title="Anillo de campeón con ${esc(t.team.name)}">${crestHTML(t.team,'sm')}${iconSVG('ring','#FFD24C',15)}${esc(t.team.name)}${t.count>1?` ×${t.count}`:''}${seasons?`<span style="opacity:.65;font-weight:600;margin-left:4px">${esc(seasons)}</span>`:''}</span>`;
    }).join('');
    return `<div class="champBadge champBadge-nba" style="flex-wrap:wrap">${iconSVG('trophy','#FFD24C',20)} <b>Campeón de la NBA${nbaChampionStints.length>1?` (x${nbaChampionStints.length} anillos del Trofeo Larry O'Brien)`:' — Trofeo Larry O\'Brien'}</b><div class="ringRow">${chips}</div></div>`;
  }
  if(otherTitleStints.length>0){
    const leagues = [...new Set(otherTitleStints.map(s=>s.league))].join(', ');
    return `<div class="champBadge champBadge-other">${iconSVG('trophy','#c9c9c9',18)} Campeón en ${esc(leagues)}, pero todavía sin anillo de NBA</div>`;
  }
  return `<div class="champBadge champBadge-none">Todavía no ganaste ningún título.</div>`;
}

        </div>

}
function onDraftNameInput(el){
  // Surgical update: only touch the jersey preview text node directly, never
  // call the full render() while the user is typing, so the input never
  // loses focus/caret position mid-word.
  G._draft.name = el.value;
  const jname = document.getElementById('jerseyNameText');
  if(jname) jname.textContent = (el.value||'APELLIDO').split(' ').slice(-1)[0].toUpperCase();
  const btn = document.querySelector('.createFooter button');
  if(btn) btn.disabled = !el.value;
}
function onDraftNumberInput(el){
  // Digits only, max 2 -- and crucially, a plain string (not re-parsed as an int) so a real
  // NBA-style "00" jersey stays distinct from "0" instead of collapsing into the same number.
  const clean = el.value.replace(/[^0-9]/g,'').slice(0,2);
  if(clean !== el.value) el.value = clean;
  G._draft.number = clean;
  const jnum = document.getElementById('jerseyNumText');
  if(jnum) jnum.textContent = clean || '0';
}
function confirmCreate(){
  const d = G._draft;
  if(!d.name) return;
  // Keep "00" as its own distinct number (a real, valid NBA jersey number, different from "0")
  // by validating the range without collapsing the string through parseInt.
  let numStr = String(d.number==null?'':d.number).replace(/[^0-9]/g,'').slice(0,2);
  const parsed = parseInt(numStr,10);
  if(numStr==='' || !isFinite(parsed) || parsed<0 || parsed>99) numStr = String(randi(0,99));
  const college = choice(COLLEGES);
  G.player = newPlayer({name:d.name, number:numStr, hand:d.hand, nationality:d.nationality, position:d.position, college, mode:d.mode});
  G.player.currentTeamObj = null;
  // Prep-to-pro: an extremely rare, LeBron-style case where an elite-rolled 18-year-old
  // skips college entirely and jumps straight to the NBA draft. Deliberately double-gated
  // (a hard OVR floor AND a low dice roll) so it's a special, memorable rarity, not a norm.
  const rolledOvr = overallRating(G.player.attrs);
  const isEliteRoll = rolledOvr >= 62;
  if(isEliteRoll && Math.random() < 0.05){
    G.player.stage = 'college'; // resolveDraftChoice() will flip this to 'pro'
    G.player.skippedCollege = true;
    G._justSkippedCollege = true;
    G.player.pendingDecision = {type:'draft', title:'Directo al Draft de la NBA', desc:`${d.name} decide saltear la universidad y anotarse directo en el Draft de la NBA. Un caso excepcional: pocos jugadores en la historia se animaron a este camino.`};
  } else {
    G.player.pendingDecision = {type:'college_offer', title:'Oferta de universidades', desc:'Tres programas universitarios quieren sumarte a su proyecto. Elegí dónde empieza tu carrera.'};
  }
  G._draft = null;
  G.screen = 'hub';
  render();
}

/* ---- Vitals bar: forma / moral / hinchada + money / fama, all driven by decisions ---- */
function vitalsBarHTML(p){
  const forma = p.forma==null?60:p.forma;
  const moral = p.moral==null?75:p.moral;
  const hinchada = p.hinchada==null?55:p.hinchada;
  const bar = (label,val,color)=>`<div class="vitalItem">
    <div class="vitalTop"><span class="vlabel">${label}</span><span class="vval">${Math.round(val)}</span></div>
    <div class="vitalTrack"><div class="vitalFill" style="width:${clamp(val,0,100)}%;background:${color}"></div></div>
  </div>`;
  return `<div class="vitalsBar">
    <div class="vitalsBars">
      ${bar('Forma', forma, '#f97316')}
      ${bar('Moral', moral, 'var(--accent)')}
      ${bar('Hinchada', hinchada, 'var(--gold)')}
    </div>
    <div class="vitalsMoney">
      <span class="vm money">💰 ${fmtMoney(p.money||0)}</span>
      <span class="vm fama">⭐ ${Math.round(p.fama||0)}</span>
      <button class="shopOpenBtn" onclick="openShop()">🛍️ Tienda</button>
    </div>
  </div>`;
}

function offerSection(dec, cards, showRetire){

    html += `<div class="offerCard" onclick="sfxClick();${c.onclick}">

      ${crestHTML(c.crest, null)}

      ${c.detail?`<div class="odetail">${esc(c.detail)}</div>`:''}
    </div>`;
  });
  if(showRetire){
    html += `<div class="offerCard retireCard" onclick="sfxClick();retirePlayer()">
      <div class="kicker">Finalizar</div><div class="gambleImg">${iconSVG('flag','#ef4444',28)}</div>
      <div class="oname">Retirarse</div><div class="osub">Terminar tu carrera profesional</div>
    </div>`;

  html += '</div>';
  return html;
}
function resolveDraftChoiceIdx(i){ const opt=G._pendingOffers[i]; G._pendingOffers=null; resolveDraftChoice(opt); }
function resolveTransferChoiceIdx(i){ const opt=G._pendingOffers[i]; G._pendingOffers=null; resolveTransferChoice(opt); }
function resolveGambleWrap(doIt){ resolveGamble(doIt); }

      <td><div class="rowClub">${crestHTML(s.team,'sm')}<span>${esc(s.team.name)}</span>${s.champion?'<span class="miniChamp" title="Campeón">'+iconSVG('trophy','#FFD24C',13)+'</span>':''}${s.injury?`<span class="miniInjury" title="Lesión: ${esc(s.injury.name)} (${esc(s.injury.label)})">`+iconSVG('cross','#ef4444',13)+'</span>':''}</div></td>
      <td><span class="ovrChip ${ovrTier(s.ovrEnd)}">${s.ovrEnd}</span></td>
      <td>${fmtInt(s.pj)}</td><td>${avgStat(s.pts,s.pj)}</td><td>${avgStat(s.reb,s.pj)}</td><td>${avgStat(s.ast,s.pj)}</td>
      <td><div class="rowTrophies">${trophyIconsHTML(s.trophies,4)}</div></td>
    </tr>`;
  }).join('');
  const currentOv = Math.round(overallRating(p.attrs));
  const pendingRow = !p.retired ? `<tr class="pending">
    <td class="rowAge">${p.age}</td>
    <td><div class="rowClub"><div class="qmark" style="width:20px;height:20px;font-size:9px">?</div><span>Eligiendo club...</span></div></td>
    <td><span class="ovrChip ${ovrTier(currentOv)}">${currentOv}</span></td>
    <td colspan="5"></td>
  </tr>` : '';
  const nat = p.nationalTeam;
  return `<div class="card timelineCard">
    <table>
      <thead><tr><th>Edad</th><th>Club</th><th>OVR</th><th>PJ</th><th>PPG</th><th>RPG</th><th>APG</th><th>Trofeos</th></tr></thead>
      <tbody>${rows}${pendingRow}</tbody>
    </table>
    <div class="natTeamRow">
      ${flagImgHTML(p.nationality.code,24)}
      <span class="info">${esc(p.nationality.name)}</span>
      <div class="stats">
        <div><div class="v">${fmtInt(nat.pj)}</div><div class="l">PJ</div></div>
        <div><div class="v">${avgStat(nat.pts,nat.pj)}</div><div class="l">PPG</div></div>
        <div><div class="v">${avgStat(nat.reb,nat.pj)}</div><div class="l">RPG</div></div>
        <div><div class="v">${avgStat(nat.ast,nat.pj)}</div><div class="l">APG</div></div>
      </div>
      <div class="rowTrophies">${trophyIconsHTML(nat.medals,6)}</div>
    </div>
  </div>`;
}

/* ============================= RENDER: RETIRED ============================= */
function renderRetired(){
  const p = G.player;
  const ov = Math.round(overallRating(p.attrs));
  const verdict = hofVerdict(p.legacy);
  const val = marketValue(ov, p.age);

  const byTeam = {};
  for(const s of p.stints){
    const key = s.team.name;
    if(!byTeam[key]) byTeam[key] = {team:s.team, pj:0,pts:0,reb:0,ast:0,trophies:[],titles:0,seasons:0};
    byTeam[key].pj+=s.pj; byTeam[key].pts+=s.pts; byTeam[key].reb+=s.reb; byTeam[key].ast+=s.ast;
    byTeam[key].seasons++;
    if(s.champion) byTeam[key].titles++;
    // Push every occurrence (not deduped) -- trophyIconsHTML does its own counting from the raw
    // list, so keeping duplicates here is what makes the ×N badges reflect real per-team counts.
    for(const t of s.trophies) byTeam[key].trophies.push(t);
  }
  const teamCards = Object.values(byTeam).map(t=>`
    <div class="teamHistCard" style="background:linear-gradient(165deg, ${t.team.color}59, ${t.team.color}1f 55%, #14141408)">
      <div class="teamHistCardClip">
        ${t.team.logoUrl ? `<img class="teamWatermark" src="${t.team.logoUrl}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      </div>
      ${crestHTML(t.team)}
      <div class="tname">${esc(t.team.name)} ${t.titles>0?`<span class="miniChamp" title="Campeón x${t.titles}">${iconSVG('trophy','#FFD24C',13)}</span>`:''}</div>
      <div class="stats3">
        <div><div class="v">${fmtInt(t.pj)}</div><div class="l">PJ</div></div>
        <div><div class="v">${avgStat(t.pts,t.pj)}</div><div class="l">PPG</div></div>
        <div><div class="v">${avgStat(t.reb,t.pj)}</div><div class="l">RPG</div></div>
        <div><div class="v">${avgStat(t.ast,t.pj)}</div><div class="l">APG</div></div>
      </div>
      <div class="rowTrophies">${trophyIconsHTML(t.trophies,8)}</div>
    </div>`).join('');

  // Not just the count anymore -- also which season(s) each award was actually won in, pulled
  // straight from the season/year already stored on each allAwards entry's label.
  const notableCounts = {};
  const notableSeasons = {};
  for(const a of p.allAwards){
    if(!NOTABLE_AWARDS.includes(a.award)) continue;
    notableCounts[a.award] = (notableCounts[a.award]||0)+1;
    const seasonPart = String(a.label||'').split(' · ')[0].trim();
    (notableSeasons[a.award] = notableSeasons[a.award]||[]).push(seasonPart);
  }
  const notableHTML = Object.keys(notableCounts).length ? Object.entries(notableCounts).map(([k,v])=>{
    const meta = AWARD_ICON_META[k] || {type:'ribbon',color:'#ccc'};
    const real = REAL_TROPHY_META[k];
    const seasons = (notableSeasons[k]||[]).join(', ');
    return `<div class="awardChip" ${real?`title="${esc(real.trophyName)}"`:''}>
      <span class="ic">${iconSVG(meta.type,meta.color,18)}</span>
      <span><b>${esc(k)}</b>${v>1?` ×${v}`:''}<div class="small awardSeasons">${esc(seasons)}</div></span>
    </div>`;
  }).join('') : '<div class="small">Sin premios individuales</div>';

  const histComp = findHistoricalComp(p);
  const compHTML = histComp ? `
    <div style="display:flex;align-items:center;gap:12px;margin:8px 0 10px">
      <div style="flex-shrink:0">${iconSVG('mvp','#f97316',36)}</div>
      <div>
        <div style="font-size:19px;font-weight:800">${esc(histComp.comp.name)}</div>
        <div class="small">Te parecés a ${esc(histComp.comp.name)}: ${esc(histComp.comp.blurb)}</div>
      </div>
    </div>
    <div class="statsRow" style="grid-template-columns:repeat(3,1fr)">
      <div class="statCell"><div class="v">${fmt1(histComp.ppg)}</div><div class="l">Tu PPG (real: ${fmt1(histComp.comp.pts)})</div></div>
      <div class="statCell"><div class="v">${fmt1(histComp.rpg)}</div><div class="l">Tu RPG (real: ${fmt1(histComp.comp.reb)})</div></div>
      <div class="statCell"><div class="v">${fmt1(histComp.apg)}</div><div class="l">Tu APG (real: ${fmt1(histComp.comp.ast)})</div></div>
    </div>` : '<div class="small">Necesitás más partidos jugados para calcular una comparación.</div>';

  const records = checkRecords(p);
  const retiredJerseyTeams = checkRetiredJerseys(p, byTeam);
  const recordsHTML = records.length ? records.map(r=>`
    <div class="awardChip"><span class="ic">${iconSVG('trophy','#FFD24C',18)}</span><span>${esc(r)}</span></div>`).join('')
    : '<div class="small">No superaste ningún récord histórico de la NBA.</div>';
  const jerseyHTML = retiredJerseyTeams.length ? retiredJerseyTeams.map(t=>`
    <div class="awardChip">${crestHTML(t,'sm')}<span><b>${esc(t.name)}</b> retiró tu camiseta <b>#${esc(p.number)}</b></span></div>`).join('')
    : '<div class="small">Ningún equipo retiró tu camiseta.</div>';

  return `<div class="retiredTop">
    <div class="card">
      <div class="label">Carrera finalizada</div>
      <div style="display:flex;align-items:center;gap:12px;margin:8px 0">
        <h1>${esc(p.name)}</h1>
        <span class="numPill">#${p.number}</span><span class="flagPill">${p.position}</span>
        <div class="spacer" style="flex:1"></div>
        ${ovrBadgeHTML(ov,56)}
      </div>
      <div class="small">Valor final: <b>${fmtMoney(val)}</b></div>
      <div class="statsRow" style="grid-template-columns:repeat(4,1fr)">
        <div class="statCell"><div class="v">${fmtInt(p.careerTotals.pj)}</div><div class="l">PJ</div></div>
        <div class="statCell"><div class="v">${avgStat(p.careerTotals.pts,p.careerTotals.pj)}</div><div class="l">PPG</div></div>
        <div class="statCell"><div class="v">${avgStat(p.careerTotals.reb,p.careerTotals.pj)}</div><div class="l">RPG</div></div>
        <div class="statCell"><div class="v">${avgStat(p.careerTotals.ast,p.careerTotals.pj)}</div><div class="l">APG</div></div>
      </div>
      ${championSummaryHTML(p)}
    </div>
    <div class="card">
      <div class="label">Selección</div>
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">${flagImgHTML(p.nationality.code,28)}<h2>${esc(p.nationality.name)}</h2></div>
      <div class="statsRow" style="grid-template-columns:repeat(4,1fr)">
        <div class="statCell"><div class="v">${fmtInt(p.nationalTeam.pj)}</div><div class="l">PJ</div></div>
        <div class="statCell"><div class="v">${avgStat(p.nationalTeam.pts,p.nationalTeam.pj)}</div><div class="l">PPG</div></div>
        <div class="statCell"><div class="v">${avgStat(p.nationalTeam.reb,p.nationalTeam.pj)}</div><div class="l">RPG</div></div>
        <div class="statCell"><div class="v">${avgStat(p.nationalTeam.ast,p.nationalTeam.pj)}</div><div class="l">APG</div></div>
      </div>
      <div class="rowTrophies">${p.nationalTeam.medals.length?trophyIconsHTML(p.nationalTeam.medals,8):'<span class="empty">SIN MEDALLAS</span>'}</div>
      ${(p.nationalTeam.history && p.nationalTeam.history.length) ? `<div class="fibaHistory">${p.nationalTeam.history.map(h=>{
        const tag = h.mvp ? ' · MVP del torneo' : (h.allTourney ? ' · Quinteto Ideal' : '');
        return `<div class="small fibaHistRow">${esc(h.season)} — <b>${esc(h.tournament)}</b>: ${esc(h.result)}${tag}</div>`;
      }).join('')}</div>` : ''}
    </div>
    <div class="card">
      <div class="label">Premios individuales</div>
      <div style="margin-top:10px">${notableHTML}</div>
    </div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <h2 style="margin-bottom:4px">Veredicto del Salón de la Fama</h2>
    <p style="font-size:19px;color:${verdict.color};font-weight:800">${verdict.tier}</p>
    <p class="small">Puntaje de legado: ${p.legacy}</p>
  </div>
  <div class="retiredTop" style="margin-bottom:14px">
    <div class="card">
      <div class="label">Te parecés a...</div>
      ${compHTML}
    </div>
    <div class="card">
      <div class="label">Récords históricos</div>
      <div style="margin-top:10px">${recordsHTML}</div>
    </div>
    <div class="card">
      <div class="label">Camiseta retirada</div>
      <div style="margin-top:10px">${jerseyHTML}</div>
    </div>
  </div>
  <div class="teamCardsGrid">${teamCards}</div>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap">
    <button class="outline" onclick="openLeaderboard()">🏆 Mejores carreras</button>
    ${p._uploadedToLeaderboard
      ? `<button class="outline" disabled>Carrera subida ✓</button>`
      : `<button class="outline" onclick="uploadCareer()">📤 Subir carrera</button>`}
    <button class="outline" onclick="shareCareer()">🔗 Compartir carrera</button>
    <button onclick="resetGame()">Volver a jugar</button>
  </div>`;
}

/* ============================= LOADING TRANSITION ============================= */
function renderSimulating(info){
  const label = info && info.team ? esc(info.team) : '';
  return `<div class="card center simCard">
    <div class="spinner">🏀</div>
    <h2 style="margin-top:14px">Simulando temporada${label?` en ${label}`:''}...</h2>
    <p class="small">Jugando los próximos dos años de tu carrera.</p>
    <div class="simBar"><div class="simBarFill"></div></div>
  </div>`;
}
/* A short suspense beat before a risky decision's outcome is revealed — gives the
   "does it land or not" tension the player feels when clicking something risky. */
function renderResolving(info){
  const label = (info && info.label) || 'Resolviendo...';
  return `<div class="card center simCard resolvingCard">
    <div class="diceSpin">${iconSVG('star','#f97316',44)}</div>
    <h2 style="margin-top:14px">${esc(label)}</h2>
    <p class="small">Esperando el resultado...</p>
  </div>`;
}

/* ============================= OVERLAYS / MAIN RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  if(!G){ app.innerHTML=''; return; }

  // Preserve focus/caret and scroll position across the full innerHTML rewrite,
  // so typing a letter doesn't kick you out of the input you're using.
  const activeEl = document.activeElement;
  let focusInfo = null;
  if(activeEl && activeEl.dataset && activeEl.dataset.field){
    focusInfo = {field: activeEl.dataset.field, start: activeEl.selectionStart, end: activeEl.selectionEnd};
  }
  const scrollY = (typeof window!=='undefined' && window.scrollY) || 0;
  const natListEl = document.querySelector('.natList');
  const natScroll = natListEl ? natListEl.scrollTop : null;

  document.getElementById('retireBtnTop').style.display = (G.player && !G.player.retired && G.player.age>=28 && !G.simulating && !G.resolving) ? '' : 'none';
  let html='';
  if(G.simulating){
    html += renderSimulating(G.simulating);
  } else if(G.resolving){
    html += renderResolving(G.resolving);
  } else {
    if(G._justSkippedCollege){
      html += `<div class="card" style="padding:22px;text-align:center;border:1px solid #f5b400;background:linear-gradient(180deg,#2a2205,#161200)">
        <div style="font-size:12px;letter-spacing:.08em;color:#f5b400;font-weight:800">CASO EXCEPCIONAL</div>
        <div style="font-size:22px;font-weight:900;margin-top:6px">Directo al Draft de la NBA 🏀</div>
        <p class="small" style="margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto">
          ${esc(G.player.name)} se saltea la universidad y va directo al Draft. Muy pocas veces en la historia un jugador se anima a este camino.</p>
      </div>`;
      G._justSkippedCollege = null;
    }
    // Once the career is over, the retired screen is a clean summary -- any leftover "you just
    // won this" / "you just renewed" banner from the final active season shouldn't carry over.
    if(G.screen!=='retired' && G._flash){
      if(G._justWonTitle){ html += championRevealHTML(G._flash, G._justWonTitle); G._justWonTitle = null; }
      else html += `<div class="card flashCard"><b>${esc(G._flash)}</b></div>`;
    }
    if(G.screen!=='retired' && G._justWonAwards && G._justWonAwards.length){ html += awardsRevealHTML(G._justWonAwards); G._justWonAwards = null; }
    if(G.screen==='retired'){ G._flash=null; G._justWonTitle=null; G._justWonAwards=null; }
    if(G.screen==='create') html += renderCreate();
    else if(G.screen==='hub') html += renderHub();
    else if(G.screen==='retired') html += renderRetired();
  }
  app.innerHTML = html;
  document.getElementById('overlayRoot').innerHTML = G.overlay || '';

  if(focusInfo){
    const el = document.querySelector(`[data-field="${focusInfo.field}"]`);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange==='function' && (el.type==='text' || el.type==='search')){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
  const natListEl2 = document.querySelector('.natList');
  if(natListEl2 && natScroll!=null) natListEl2.scrollTop = natScroll;
  if(typeof window!=='undefined' && window.scrollTo) window.scrollTo(0, scrollY);
}

/* ============================= INIT ============================= */
(function init(){
  if(!loadGame()){ G = freshState(); }
  render();
})();
</script>
</body>
</html>
